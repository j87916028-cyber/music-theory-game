<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎹 音樂達人 - 爆肝也要玩！</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background: linear-gradient(135deg, #0d0d1a 0%, #1a1a2e 50%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: white;
            padding: 15px;
        }
        @keyframes levelUp { 0% { transform: scale(1); } 50% { transform: scale(1.3); } 100% { transform: scale(1); } }
        @keyframes rainbow { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        
        .xp-bar { width: 100%; max-width: 500px; height: 20px; background: rgba(255,255,255,0.2); border-radius: 10px; overflow: hidden; margin: 10px 0; }
        .xp-fill { height: 100%; background: linear-gradient(90deg, #ff6b6b, #ffd700, #4caf50, #00bfff); background-size: 200% 200%; animation: rainbow 2s ease infinite; transition: width 0.5s; }
        .level-badge { font-size: 1.5rem; font-weight: bold; padding: 5px 20px; background: linear-gradient(135deg, #ffd700, #ff8c00); border-radius: 20px; color: #000; animation: pulse 2s infinite; }
        h1 { font-size: 2rem; margin-bottom: 5px; background: linear-gradient(90deg, #ff6b6b, #ffd700, #4caf50, #00bfff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; animation: rainbow 3s linear infinite; }
        .stats-row { display: flex; gap: 15px; flex-wrap: wrap; justify-content: center; margin: 10px 0; }
        .stat-box { background: rgba(255,255,255,0.1); padding: 10px 20px; border-radius: 15px; text-align: center; min-width: 100px; }
        .stat-value { font-size: 1.5rem; font-weight: bold; }
        .stat-label { font-size: 0.8rem; opacity: 0.7; }
        .streak-fire { color: #ff6b6b; font-size: 2rem; animation: float 0.5s infinite; }
        
        .main-container { width: 100%; max-width: 600px; background: rgba(255,255,255,0.05); border-radius: 25px; padding: 20px; margin: 15px 0; }
        .mode-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin-bottom: 20px; }
        .mode-card { background: linear-gradient(135deg, rgba(255,255,255,0.1), rgba(255,255,255,0.05)); border: 2px solid rgba(255,255,255,0.2); border-radius: 20px; padding: 20px; text-align: center; cursor: pointer; transition: all 0.3s; }
        .mode-card:hover { transform: translateY(-5px); border-color: #ffd700; box-shadow: 0 10px 30px rgba(255,215,0,0.3); }
        .mode-card.locked { opacity: 0.5; filter: grayscale(1); }
        .mode-card .icon { font-size: 3rem; margin-bottom: 10px; }
        .mode-card .name { font-size: 1.2rem; font-weight: bold; margin-bottom: 5px; }
        .mode-card .desc { font-size: 0.8rem; opacity: 0.7; }
        
        .daily-reward { background: linear-gradient(135deg, #ffd700, #ff8c00); border-radius: 20px; padding: 20px; text-align: center; margin: 15px 0; }
        
        .tab-buttons { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn { flex: 1; padding: 12px; background: rgba(255,255,255,0.1); border: none; border-radius: 10px; color: white; cursor: pointer; font-size: 1rem; }
        .tab-btn.active { background: linear-gradient(135deg, #e94560, #ff6b6b); }
        
        .game-area { display: none; text-align: center; }
        .game-area.active { display: block; }
        .note-display { font-size: 6rem; margin: 20px 0; animation: float 1s ease infinite; cursor: pointer; }
        .options-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .option-btn { padding: 20px; font-size: 1.3rem; background: rgba(255,255,255,0.1); border: 2px solid rgba(255,255,255,0.2); border-radius: 15px; color: white; cursor: pointer; transition: all 0.2s; }
        .option-btn:hover { background: rgba(255,255,255,0.2); transform: scale(1.02); }
        .option-btn.correct { background: #4caf50 !important; border-color: #4caf50 !important; animation: levelUp 0.3s; }
        .option-btn.wrong { background: #f44336 !important; border-color: #f44336 !important; opacity: 0.5; }
        
        .feedback-popup { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 4rem; font-weight: bold; z-index: 1000; animation: levelUp 0.5s forwards; text-shadow: 0 0 30px currentColor; }
        .back-btn { position: fixed; top: 20px; left: 20px; font-size: 1.5rem; background: rgba(255,255,255,0.2); border: none; border-radius: 50%; width: 50px; height: 50px; cursor: pointer; color: white; }
        
        .quest-card { background: linear-gradient(135deg, #2d2d44, #1a1a2e); border-radius: 15px; padding: 15px; margin: 10px 0; display: flex; align-items: center; gap: 15px; }
        .quest-icon { font-size: 2rem; }
        .quest-info { flex: 1; }
        .quest-title { font-weight: bold; }
        .quest-progress { font-size: 0.8rem; opacity: 0.7; }
        .quest-reward { background: linear-gradient(135deg, #ffd700, #ff8c00); padding: 5px 15px; border-radius: 10px; font-weight: bold; color: #000; }
        
        .achievement-card { background: rgba(255,255,255,0.1); border-radius: 15px; padding: 15px; margin: 10px 0; display: flex; align-items: center; gap: 15px; border: 2px solid transparent; }
        .achievement-card.unlocked { border-color: #ffd700; background: rgba(255,215,0,0.1); }
        .achievement-icon { font-size: 2.5rem; }
        .achievement-info { flex: 1; }
        .achievement-title { font-weight: bold; }
        .achievement-desc { font-size: 0.8rem; opacity: 0.7; }
        
        .collection-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 20px 0; }
        .collection-item { background: rgba(255,255,255,0.1); border-radius: 15px; padding: 15px; text-align: center; font-size: 2rem; cursor: pointer; transition: all 0.2s; }
        .collection-item:hover { transform: scale(1.1); }
        .collection-item.owned { background: rgba(255,215,0,0.2); border: 2px solid #ffd700; }
        .collection-item.equipped { border-color: #4caf50; box-shadow: 0 0 20px #4caf50; }
    </style>
</head>
<body>
    <button class="back-btn" onclick="showHome()" style="display:none" id="backBtn">⬅️</button>
    <div id="homePage">
        <h1>🎹 音樂達人</h1>
        <div class="stats-row">
            <div class="stat-box"><div class="stat-value" id="playerLevel">1</div><div class="stat-label">等級</div></div>
            <div class="stat-box"><div class="stat-value" id="playerXP">0</div><div class="stat-label">經驗值</div></div>
            <div class="stat-box"><div class="stat-value" id="totalCoins">0</div><div class="stat-label">金幣 💰</div></div>
            <div class="stat-box"><span class="streak-fire" id="streakEmoji">🔥</span><div class="stat-value" id="dayStreak">0</div><div class="stat-label">天數</div></div>
        </div>
        <div class="xp-bar"><div class="xp-fill" id="xpFill" style="width: 0%"></div></div>
        <div class="daily-reward" id="dailyReward" onclick="claimDailyReward()">
            <div style="font-size: 1.2rem;">📅 每日登入獎勵</div>
            <div style="font-size: 2rem; margin: 10px 0;">🎁</div>
            <div id="dailyText">點擊領取！</div>
        </div>
        <div class="main-container">
            <div class="tab-buttons">
                <button class="tab-btn active" onclick="switchTab('play')">🎮 遊戲</button>
                <button class="tab-btn" onclick="switchTab('quest')">📋 任務</button>
                <button class="tab-btn" onclick="switchTab('collection')">🎨 收藏</button>
                <button class="tab-btn" onclick="switchTab('achievement')">🏆 成就</button>
            </div>
            <div id="tabPlay" class="tab-content">
                <div class="mode-grid">
                    <div class="mode-card" onclick="startGame('ear')"><div class="icon">👂</div><div class="name">听力大師</div><div class="desc">聽聲音猜音符</div></div>
                    <div class="mode-card" onclick="startGame('note')"><div class="icon">🎵</div><div class="name">音符認識</div><div class="desc">認識音名與唱名</div></div>
                    <div class="mode-card" onclick="startGame('rhythm')"><div class="icon">🥁</div><div class="name">節奏訓練</div><div class="desc">學習各種音符時值</div></div>
                    <div class="mode-card" onclick="startGame('chord')"><div class="icon">🎹</div><div class="name">和弦教室</div><div class="desc">認識和弦組成</div></div>
                    <div class="mode-card" onclick="startGame('scale')"><div class="icon">🎼</div><div class="name">音階練習</div><div class="desc">大小調音階</div></div>
                    <div class="mode-card" id="bossCard" onclick="startGame('boss')"><div class="icon">👑</div><div class="name">BOSS戰</div><div class="desc">挑戰音樂BOSS</div><div class="lock" id="bossLock">🔒 Lv.5</div></div>
                    <div class="mode-card" onclick="startGame('weekly')">
                        <div class="icon">📊</div>
                        <div class="name">週挑戰</div>
                        <div class="desc">每週限時挑戰</div>
                    </div>
                    <div class="mode-card" onclick="startGame('practice')">
                        <div class="icon">🎯</div>
                        <div class="name">練習模式</div>
                        <div class="desc">無壓力練習</div>
                    </div>
                    <div class="mode-card" onclick="startGame('boss')">
                        <div class="icon">👑</div><div class="name">BOSS戰</div><div class="desc">挑戰音樂BOSS</div><div class="lock" id="bossLock">🔒 Lv.5</div></div>
                </div>
            </div>
            <div id="tabQuest" class="tab-content" style="display:none"><div id="dailyQuests"></div></div>
            <div id="tabCollection" class="tab-content" style="display:none"><h3 style="margin-bottom:15px;">🎹 樂器主題</h3><div class="collection-grid" id="instrumentCollection"></div></div>
            <div id="tabAchievement" class="tab-content" style="display:none"><div id="achievementsList"></div></div>
        </div>
    </div>
    <div id="gameArea" class="game-area">
        <div class="stats-row">
            <div class="stat-box"><div class="stat-value" id="gameScore">0</div><div class="stat-label">分數</div></div>
            <div class="stat-box"><div class="stat-value" id="gameCombo">0</div><div class="stat-label">COMBO</div></div>
        </div>
        <div class="hint-text" id="gameHint"></div>
        <div id="gameContent"></div>
    </div>
    
    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const notes = ['Do', 'Re', 'Mi', 'Fa', 'Sol', 'La', 'Si'];
        const noteFreqs = { Do: 261.63, Re: 293.66, Mi: 329.63, Fa: 349.23, Sol: 392.00, La: 440.00, Si: 493.88 };
        const rhythms = [{ name: '全音符', beats: 4, symbol: '𝅝' }, { name: '二分音符', beats: 2, symbol: '𝅗𝅥' }, { name: '四分音符', beats: 1, symbol: '♩' }, { name: '八分音符', beats: 0.5, symbol: '♪' }];
        const chords = [{ name: 'C', notes: ['Do','Mi','Sol'] }, { name: 'G', notes: ['Sol','Si','Re'] }, { name: 'F', notes: ['Fa','La','Do'] }, { name: 'Am', notes: ['La','Do','Mi'] }, { name: 'Dm', notes: ['Re','Fa','La'] }, { name: 'Em', notes: ['Mi','Sol','Si'] }];
        const scales = [{ name: 'C大調', notes: ['Do','Re','Mi','Fa','Sol','La','Si'] }, { name: 'A小調', notes: ['La','Si','Do','Re','Mi','Fa','Sol'] }, { name: 'G大調', notes: ['Sol','La','Si','Do','Re','Mi','Fa#'] }];
        const instruments = [{ id: 'piano', emoji: '🎹', name: '鋼琴', unlockXP: 0 }, { id: 'guitar', emoji: '🎸', name: '吉他', unlockXP: 100 }, { id: 'violin', emoji: '🎻', name: '小提琴', unlockXP: 500 }, { id: 'drum', emoji: '🥁', name: '鼓', unlockXP: 1000 }, { id: 'sax', emoji: '🎷', name: '薩克斯', unlockXP: 2500 }, { id: 'trumpet', emoji: '🎺', name: '小號', unlockXP: 5000 },
            { id: 'flute', emoji: '🎼', name: '長笛', unlockXP: 7500 },
            { id: 'synth', emoji: '🎛️', name: '合成器', unlockXP: 10000 },
            { id: 'mic', emoji: '🎤', name: '麥克風', unlockXP: 15000 },
            { id: 'band', emoji: '🎷', name: '樂團', unlockXP: 25000 }];
        const achievements = [{ id: 'first', name: '初試身手', desc: '完成第一題', icon: '🎯', req: 1 }, { id: 'streak5', name: '熱身完畢', desc: '達成 5 連擊', icon: '🔥', req: 5 }, { id: 'streak10', name: '火力全開', desc: '達成 10 連擊', icon: '💥', req: 10 }, { id: 'coins100', name: '小有積蓄', desc: '獲得 100 金幣', icon: '💰', req: 100 }, { id: 'coins500', name: '小富翁', desc: '獲得 500 金幣', icon: '🤑', req: 500 }, { id: 'level5', name: '初露頭角', desc: '達到 5 級', icon: '⭐', req: 5 }, { id: 'level10', name: '音樂新星', desc: '達到 10 級', icon: '🌟', req: 10 }, { id: 'daily7', name: '持之以恆', desc: '連續登入 7 天', icon: '📅', req: 7 }];
        
        let playerData = { xp: parseInt(localStorage.getItem('musicXP') || '0'), coins: parseInt(localStorage.getItem('musicCoins') || '0'), level: 1, dayStreak: parseInt(localStorage.getItem('musicStreak') || '0'), lastLogin: localStorage.getItem('musicLastLogin') || '', totalPlayed: parseInt(localStorage.getItem('musicPlayed') || '0'), achievements: JSON.parse(localStorage.getItem('musicAchievements') || '[]'), instruments: JSON.parse(localStorage.getItem('musicInstruments') || '["piano"]'), equippedInstrument: localStorage.getItem('musicEquipped') || 'piano', dailyQuests: JSON.parse(localStorage.getItem('musicDailyQuests') || '{}') };
        
        let gameScore = 0, gameCombo = 0, currentMode = '', currentQuestion = null, questionsAnswered = 0, correctThisRound = 0;
        
        function calcLevel(xp) { let level = 1, needXP = 50; while (xp >= needXP) { xp -= needXP; level++; needXP = Math.floor(needXP * 1.5); } return { level, currentXP: xp, needXP }; }
        function saveData() { localStorage.setItem('musicXP', playerData.xp); localStorage.setItem('musicCoins', playerData.coins); localStorage.setItem('musicStreak', playerData.dayStreak); localStorage.setItem('musicLastLogin', playerData.lastLogin); localStorage.setItem('musicPlayed', playerData.totalPlayed); localStorage.setItem('musicAchievements', JSON.stringify(playerData.achievements)); localStorage.setItem('musicInstruments', JSON.stringify(playerData.instruments)); localStorage.setItem('musicEquipped', playerData.equippedInstrument); localStorage.setItem('musicDailyQuests', JSON.stringify(playerData.dailyQuests)); }
        
        function updateUI() {
            const { level, currentXP, needXP } = calcLevel(playerData.xp);
            playerData.level = level;
            document.getElementById('playerLevel').textContent = level;
            document.getElementById('playerXP').textContent = currentXP + '/' + needXP;
            document.getElementById('xpFill').style.width = (currentXP / needXP * 100) + '%';
            document.getElementById('totalCoins').textContent = playerData.coins;
            document.getElementById('dayStreak').textContent = playerData.dayStreak;
            checkDailyLogin(); updateCollection(); updateAchievements(); updateQuests();
            const bossCard = document.getElementById('bossCard'); const bossLock = document.getElementById('bossLock');
            if (level >= 5) { bossCard.classList.remove('locked'); if (bossLock) bossLock.style.display = 'none'; }
        }
        
        function checkDailyLogin() {
            const today = new Date().toISOString().split('T')[0];
            if (playerData.lastLogin !== today) {
                if (playerData.lastLogin) { const diff = (new Date(today) - new Date(playerData.lastLogin)) / (1000 * 60 * 60 * 24); if (diff > 1) playerData.dayStreak = 0; }
                document.getElementById('dailyText').textContent = '點擊領取今日獎勵！';
            } else { document.getElementById('dailyText').textContent = '已連續登入 ' + playerData.dayStreak + ' 天 ✅'; document.getElementById('dailyReward').style.opacity = '0.7'; }
        }
        
        function claimDailyReward() {
            const today = new Date().toISOString().split('T')[0];
            if (playerData.lastLogin === today) return;
            playerData.lastLogin = today; playerData.dayStreak++;
            const reward = 10 + playerData.dayStreak * 5; playerData.coins += reward; playerData.xp += 20;
            saveData(); showFeedback('+' + reward + '💰', '#ffd700'); updateUI();
        }
        
        function updateCollection() {
            const grid = document.getElementById('instrumentCollection');
            grid.innerHTML = instruments.map(inst => {
                const owned = playerData.instruments.includes(inst.id); const equipped = playerData.equippedInstrument === inst.id; const unlocked = playerData.xp >= inst.unlockXP;
                return '<div class="collection-item ' + (owned ? 'owned' : '') + ' ' + (equipped ? 'equipped' : '') + '" onclick="' + (owned ? 'equipInstrument(\'' + inst.id + '\')' : (unlocked ? 'unlockInstrument(\'' + inst.id + '\')' : '')) + '">' + inst.emoji + '<div style="font-size:0.7rem">' + inst.name + '</div>' + (!owned && !unlocked ? '<div style="font-size:0.6rem">🔒</div>' : '') + '</div>';
            }).join('');
        }
        
        function unlockInstrument(id) {
            const inst = instruments.find(i => i.id === id);
            if (playerData.xp >= inst.unlockXP) { playerData.instruments.push(id); playerData.equippedInstrument = id; saveData(); updateUI(); showFeedback('解鎖 ' + inst.name + '！', '#4caf50'); }
        }
        function equipInstrument(id) { if (playerData.instruments.includes(id)) { playerData.equippedInstrument = id; saveData(); updateUI(); } }
        
        function updateAchievements() {
            const list = document.getElementById('achievementsList');
            list.innerHTML = achievements.map(ach => {
                const unlocked = playerData.achievements.includes(ach.id);
                return '<div class="achievement-card ' + (unlocked ? 'unlocked' : '') + '"><div class="achievement-icon">' + ach.icon + '</div><div class="achievement-info"><div class="achievement-title">' + ach.name + '</div><div class="achievement-desc">' + ach.desc + '</div></div>' + (unlocked ? '<div style="font-size:1.5rem">✅</div>' : '') + '</div>';
            }).join('');
        }
        
        function updateQuests() {
            const today = new Date().toISOString().split('T')[0];
            if (playerData.dailyQuests.date !== today) {
                playerData.dailyQuests = { date: today, quests: [{ id: 'play10', desc: '回答 10 題', progress: 0, target: 10, reward: 20 }, { id: 'perfect3', desc: '3 題全對', progress: 0, target: 3, reward: 30 }, { id: 'earn50', desc: '獲得 50 金幣', progress: 0, target: 50, reward: 40 }] };
                localStorage.setItem('musicDailyQuests', JSON.stringify(playerData.dailyQuests));
            }
            const container = document.getElementById('dailyQuests');
            container.innerHTML = '<h3 style="margin-bottom:15px;">📋 今日任務</h3>';
            playerData.dailyQuests.quests.forEach(q => {
                container.innerHTML += '<div class="quest-card"><div class="quest-icon">📌</div><div class="quest-info"><div class="quest-title">' + q.desc + '</div><div class="quest-progress">' + q.progress + '/' + q.target + '</div></div><div class="quest-reward">+' + q.reward + '💰</div></div>';
            });
        }
        
        function checkQuests() {
            playerData.dailyQuests.quests.forEach(q => {
                if (q.id === 'play10' && q.progress < q.target) { q.progress++; if (q.progress >= q.target) { playerData.coins += q.reward; showFeedback('+' + q.reward + '💰 任務完成！', '#ffd700'); } }
                if (q.id === 'perfect3' && correctThisRound >= 3 && q.progress < q.target) { q.progress++; if (q.progress >= q.target) { playerData.coins += q.reward; showFeedback('+' + q.reward + '💰 任務完成！', '#ffd700'); } }
            });
            saveData(); updateQuests();
        }
        
        function playNote(note) { const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain(); osc.connect(gain); gain.connect(audioCtx.destination); osc.frequency.value = noteFreqs[note]; osc.type = 'sine'; gain.gain.setValueAtTime(0.3, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5); osc.start(); osc.stop(audioCtx.currentTime + 0.5); }
        
        function switchTab(tab) { document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active')); event.target.classList.add('active'); document.querySelectorAll('.tab-content').forEach(c => c.style.display = 'none'); document.getElementById('tab' + tab.charAt(0).toUpperCase() + tab.slice(1)).style.display = 'block'; }
        
        function showHome() { document.getElementById('homePage').style.display = 'block'; document.getElementById('gameArea').classList.remove('active'); document.getElementById('backBtn').style.display = 'none'; updateUI(); }
        
        function startGame(mode) { currentMode = mode; gameScore = 0; gameCombo = 0; questionsAnswered = 0; correctThisRound = 0; document.getElementById('homePage').style.display = 'none'; document.getElementById('gameArea').classList.add('active'); document.getElementById('backBtn').style.display = 'block'; updateGameUI(); nextQuestion(); }
        
        function updateGameUI() { document.getElementById('gameScore').textContent = gameScore; document.getElementById('gameCombo').textContent = gameCombo; }
        
        function nextQuestion() { document.getElementById('gameContent').innerHTML = ''; switch(currentMode) { case 'ear': earTraining(); break; case 'note': noteRecognition(); break; case 'rhythm': rhythmTraining(); break; case 'chord': chordTraining(); break; case 'scale': scaleTraining(); break; case 'boss': bossBattle(); break; } }
        
        function earTraining() {
            const correct = notes[Math.floor(Math.random() * notes.length)];
            currentQuestion = correct;
            document.getElementById('gameHint').textContent = '🎧 聽聲音，選音符';
            document.getElementById('gameContent').innerHTML = '<div class="note-display" onclick="playNote(\'' + correct + '\')">🔊</div><div class="options-grid">' + notes.map(n => '<button class="option-btn" onclick="checkAnswer(\'' + n + '\',\'' + correct + '\')">' + n + '</button>').join('') + '</div>';
            setTimeout(() => playNote(correct), 300);
        }
        
        function noteRecognition() {
            const note = notes[Math.floor(Math.random() * notes.length)];
            const mode = Math.random() > 0.5;
            currentQuestion = note;
            const correct = mode ? noteNames[note] : note;
            setTimeout(() => playNote(note), 100);
            document.getElementById('gameHint').textContent = mode ? '這個音符的音名是？' : '這個音符的唱名是？';
            let opts = [correct]; const all = mode ? ['C','D','E','F','G','A','B'] : notes;
            while (opts.length < 4) { const o = all[Math.floor(Math.random() * all.length)]; if (!opts.includes(o)) opts.push(o); }
            opts.sort(() => Math.random() - 0.5);

            const rhythm = rhythms[Math.floor(Math.random() * rhythms.length)];
            currentQuestion = rhythm.name;
            document.getElementById('gameHint').textContent = '這個音符有幾拍？';
            document.getElementById('gameContent').innerHTML = '<div class="note-display">' + rhythm.symbol + '</div><div class="options-grid">' + [0.5,1,2,4].map(n => '<button class="option-btn" onclick="checkAnswer(' + n + ',' + rhythm.beats + ')">' + n + ' 拍</button>').join('') + '</div>';
        }
        
        function chordTraining() {
            const chord = chords[Math.floor(Math.random() * chords.length)];
            currentQuestion = chord.name;
            document.getElementById('gameHint').textContent = '🎧 聽和弦，選名稱';
            document.getElementById('gameContent').innerHTML = '<button onclick="playChord(\'' + chord.notes.join(',') + '\')" style="font-size:3rem;background:linear-gradient(135deg,#9b59b6,#8e44ad);border:none;border-radius:50%;width:100px;height:100px;cursor:pointer;">🔊</button><div class="options-grid">' + chords.map(c => '<button class="option-btn" onclick="checkAnswer(\'' + c.name + '\',\'' + chord.name + '\')">' + c.name + '</button>').join('') + '</div>';
            setTimeout(() => playChord(chord.notes), 300);
        }
        
        function playChord(notesStr) { notesStr.split(',').forEach((n, i) => { setTimeout(() => playNote(n), i * 100); }); }
        
        function scaleTraining() {
            const scale = scales[Math.floor(Math.random() * scales.length)];
            currentQuestion = scale.name;
            document.getElementById('gameHint').textContent = '🎧 聽音階，選名稱';
            document.getElementById('gameContent').innerHTML = '<button onclick="playScale(\'' + scale.notes.join(',') + '\')" style="font-size:3rem;background:linear-gradient(135deg,#4caf50,#8bc34a);border:none;border-radius:50%;width:100px;height:100px;cursor:pointer;">🔊</button><div class="options-grid">' + scales.map(s => '<button class="option-btn" onclick="checkAnswer(\'' + s.name + '\',\'' + scale.name + '\')">' + s.name + '</button>').join('') + '</div>';
            setTimeout(() => playScale(scale.notes), 300);
        }
        
        function playScale(notesStr) { notesStr.split(',').forEach((n, i) => { setTimeout(() => playNote(n), i * 300); }); }
        
        function bossBattle() {
            const bosses = [{ name: '節奏怪獸', q: () => { const r = rhythms[Math.floor(Math.random() * rhythms.length)]; currentQuestion = r.name; document.getElementById('gameHint').textContent = '👑 BOSS挑戰！這是什麼音符？'; return { display: '<div class="note-display">' + r.symbol + '</div>', options: [0.5,1,2,4].map(n => '<button class="option-btn" onclick="checkAnswer(' + n + ',' + r.beats + ')">' + n + ' 拍</button>').join('') }; } }];
            const boss = bosses[0]; const q = boss.q();
            document.getElementById('gameContent').innerHTML = q.display + '<div class="options-grid">' + q.options + '</div>';
        }
        
        function checkAnswer(answer, correct) {
            questionsAnswered++; playerData.totalPlayed++;
            const isCorrect = String(answer) === String(correct);
            if (isCorrect) { gameScore += 10 + gameCombo * 2; gameCombo++; correctThisRound++; playerData.coins += 5; playerData.xp += 3; showFeedback('✅', '#4caf50'); if (gameCombo >= 5) showFeedback('🔥 ' + gameCombo + ' COMBO!', '#ffd700'); }
            else { gameCombo = 0; correctThisRound = 0; showFeedback('❌', '#f44336'); }
            updateGameUI(); checkQuests(); saveData();
            setTimeout(nextQuestion, 800);
        }
        
        function showFeedback(text, color) { const el = document.createElement('div'); el.className = 'feedback-popup'; el.textContent = text; el.style.color = color; document.body.appendChild(el); setTimeout(() => el.remove(), 600); }
        
        updateUI();

// 播放音效
function playSound(type) {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    
    if (type === 'correct') {
        osc.frequency.value = 880;
        osc.type = 'sine';
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.1);
    } else if (type === 'wrong') {
        osc.frequency.value = 200;
        osc.type = 'sawtooth';
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.3);
    } else if (type === 'levelup') {
        osc.frequency.value = 523.25;
        osc.type = 'square';
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        osc.start();
        osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1);
        osc.frequency.setValueAtTime(783.99, audioCtx.currentTime + 0.2);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
        osc.stop(audioCtx.currentTime + 0.4);
    } else if (type === 'coin') {
        osc.frequency.value = 1200;
        osc.type = 'sine';
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.05);
    }
}

    originalCheckAnswer(answer, correct);
    const { level } = calcLevel(playerData.xp);

<script>

            <div class="mode-card" onclick="practiceRhythm()"><div class="icon">🥁</div><div class="name">節奏練習</div></div>

function practiceEar() {
    const correct = notes[Math.floor(Math.random() * notes.length)];
    playNote(correct);
    document.getElementById('gameHint').textContent = '👂 這是什麼音符？';
    document.getElementById('gameContent').innerHTML = '<button onclick="practiceEar()" style="font-size:2rem;background:rgba(255,255,255,0.2);border:none;border-radius:50%;width:80px;height:80px;cursor:pointer;margin:20px;">🔊</button><div class="options-grid">' + notes.map(n => '<button class="option-btn" onclick="practiceAnswer(this,\'' + n + '\',\'' + correct + '\')">' + n + '</button>').join('') + '</div>';
}

function practiceNote() {
    const note = notes[Math.floor(Math.random() * notes.length)];
    const mode = Math.random() > 0.5;
    const correct = mode ? noteNames[note] : note;
    document.getElementById('gameHint').textContent = mode ? '這個音符的音名是？' : '這個音符的唱名是？';
    document.getElementById('gameContent').innerHTML = '<div class="note-display" style="font-size:5rem;">' + note + '</div><div class="options-grid">' + (mode ? ['C','D','E','F','G','A','B'] : notes).map(n => '<button class="option-btn" onclick="practiceAnswer(this,\'' + n + '\',\'' + correct + '\')">' + n + '</button>').join('') + '</div>';
}

function practiceRhythm() {
    const rhythm = rhythms[Math.floor(Math.random() * rhythms.length)];
    document.getElementById('gameHint').textContent = '這個音符有幾拍？';
    document.getElementById('gameContent').innerHTML = '<div class="note-display" style="font-size:5rem;">' + rhythm.symbol + '</div><div class="options-grid">' + [0.5,1,2,4].map(n => '<button class="option-btn" onclick="practiceAnswer(this,' + n + ',' + rhythm.beats + ')">' + n + ' 拍</button>').join('') + '</div>';
}

function practiceChord() {
    const chord = chords[Math.floor(Math.random() * chords.length)];
    playChord(chord.notes);
    document.getElementById('gameHint').textContent = '這是什麼和弦？';
    document.getElementById('gameContent').innerHTML = '<button onclick="practiceChord()" style="font-size:2rem;background:rgba(155,89,182,0.3);border:none;border-radius:50%;width:80px;height:80px;cursor:pointer;margin:20px;">🔊</button><div class="options-grid">' + chords.map(c => '<button class="option-btn" onclick="practiceAnswer(this,\'' + c.name + '\',\'' + chord.name + '\')">' + c.name + '</button>').join('') + '</div>';
}

function practiceAnswer(btn, answer, correct) {
    const isCorrect = String(answer) === String(correct);
    btn.classList.add(isCorrect ? 'correct' : 'wrong');
    if (isCorrect) {
        playSound('correct');
        setTimeout(() => {
            // 根據當前模式繼續
            if (document.getElementById('gameHint').textContent.includes('听力')) practiceEar();
            else if (document.getElementById('gameHint').textContent.includes('音名') || document.getElementById('gameHint').textContent.includes('唱名')) practiceNote();
            else if (document.getElementById('gameHint').textContent.includes('幾拍')) practiceRhythm();
            else if (document.getElementById('gameHint').textContent.includes('和弦')) practiceChord();
        }, 500);
    } else {
        playSound('wrong');
    }
}

function weeklyChallenge() {

    if (saved >= weekNum) {
        document.getElementById('gameHint').textContent = '📊 本週挑戰已完成！';
        document.getElementById('gameContent').innerHTML = '<div style="text-align:center;margin:30px;"><div style="font-size:4rem;">✅</div><div style="font-size:1.5rem;margin:20px;">挑戰完成！</div><button onclick="weeklyChallenge()" style="padding:15px 30px;background:linear-gradient(135deg,#ffd700,#ff8c00);border:none;border-radius:10px;font-size:1.2rem;cursor:pointer;">再玩一次</button></div>';
    } else {
        // 開始挑戰 - 20題限時
        gameScore = 0; gameCombo = 0; questionsAnswered = 0;
        document.getElementById('gameHint').textContent = '📊 週挑戰！目標：20題全對！';
        weeklyQuest();
    }
}

function getWeekNumber() {
    const now = new Date();
    const start = new Date(now.getFullYear(), 0, 1);
    return Math.ceil(((now - start) / 86400000 + start.getDay() + 1) / 7);
}

function weeklyQuest() {
    if (questionsAnswered >= 20) {
        // 挑戰完成
        const weekNum = getWeekNumber();
        localStorage.setItem('weeklyChallenge', weekNum);
        const reward = 200 + gameScore;
        playerData.coins += reward;
        playerData.xp += 100;
        saveData();
        
        document.getElementById('gameHint').textContent = '🎉 週挑戰完成！';
        document.getElementById('gameContent').innerHTML = '<div style="text-align:center;margin:30px;"><div style="font-size:4rem;">🏆</div><div style="font-size:1.5rem;margin:20px;">獲得 ' + reward + ' 金幣！</div></div>';
        
        for (let i = 0; i < 50; i++) setTimeout(() => createConfetti(), i * 30);
        return;
    }
    
    // 隨機題目
    const rand = Math.random();
    if (rand < 0.25) earTraining();
    else if (rand < 0.5) noteRecognition();
    else if (rand < 0.75) rhythmTraining();
    else chordTraining();
    
    questionsAnswered++;
    document.getElementById('gameHint').textContent = '📊 週挑戰 ' + questionsAnswered + '/20 - 目標全對！';
}

// 覆蓋 startGame
const originalStartGame = startGame;
startGame = function(mode) {
    if (mode === 'practice') {
        currentMode = 'practice';
        document.getElementById('homePage').style.display = 'none';
        document.getElementById('gameArea').classList.add('active');
        document.getElementById('backBtn').style.display = 'block';
        practiceMode();
    } else if (mode === 'weekly') {
        currentMode = 'weekly';
        document.getElementById('homePage').style.display = 'none';
        document.getElementById('gameArea').classList.add('active');
        document.getElementById('backBtn').style.display = 'block';
        weeklyChallenge();
    } else {
        originalStartGame(mode);
    }
};

function showComboAnimation(combo) {
    if (combo < 5) return;
    
    const colors = ['#ff6b6b', '#ffd700', '#4caf50', '#00bfff', '#9b59b6'];
    const color = colors[Math.floor((combo - 5) / 5) % colors.length];
    
    const el = document.createElement('div');
    el.style.cssText = `position:fixed;top:20%;left:50%;transform:translateX(-50%);font-size:3rem;font-weight:bold;color:${color};text-shadow:0 0 20px ${color};z-index:2500;animation:comboPop 1s forwards;`;

    document.body.appendChild(el);
    
    setTimeout(() => el.remove(), 1000);
}

        50% { transform:translateX(-50%) scale(1.3); opacity:1; }
        100% { transform:translateX(-50%) scale(1); opacity:0; }
    }
`;
document.head.appendChild(comboAnimStyle);

// 覆蓋 checkAnswer 加入 combo 動畫
const oldCheckAnswer = checkAnswer;
checkAnswer = function(answer, correct) {
    const isCorrect = String(answer) === String(correct);
    if (isCorrect && gameCombo >= 5) {

};

                    `).join('')}
                    ${['Do#','Re#','Fa#','Sol#','La#'].map((n,i) => `
                        <div onclick="playPianoNote('${n.replace('#','')}')" style="width:30px;height:90px;background:linear-gradient(to bottom,#333,#000);border-radius:0 0 3px 3px;margin:0 -17px;z-index:1;cursor:pointer;position:relative;top:-150px;color:#fff;font-size:0.6rem;display:flex;align-items:flex-end;justify-content:center;padding-bottom:5px;">${n}</div>

    document.head.appendChild(pianoStyle);
}

function switchInstrument(inst) {
    currentInstrument = inst;
    localStorage.setItem('pianoInstrument', inst);
    showAdvancedPiano();
}

function playPianoNote(note) {
    const inst = instruments2[currentInstrument];
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    
    // 根據音符計算頻率
    const baseFreq = noteFreqs[note] || 261.63;
    osc.frequency.value = baseFreq;
    osc.type = inst.wave;
    
    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.8);
    
    osc.start();
    osc.stop(audioCtx.currentTime + 0.8);
    
    // 錄音中
    if (isRecording && recordingNotes.length < 100) {
        recordingNotes.push({ note: note, time: Date.now() });
    }
}

// 錄音系統
let isRecording = false;
let recordingNotes = [];

function startRecording() {
    isRecording = true;
    recordingNotes = [];
    document.getElementById('recBtn').style.display = 'none';
    document.getElementById('stopBtn').style.display = 'inline-block';
    document.getElementById('playBtn').style.display = 'none';
    document.getElementById('recStatus').textContent = '🔴 錄音中...';
}

function stopRecording() {
    isRecording = false;
    document.getElementById('recBtn').style.display = 'inline-block';
    document.getElementById('stopBtn').style.display = 'none';
    document.getElementById('playBtn').style.display = 'inline-block';
    document.getElementById('recStatus').textContent = `✅ 錄製完成！${recordingNotes.length} 個音符`;
}

function playRecording() {
    if (recordingNotes.length === 0) return;
    
    const startTime = recordingNotes[0].time;
    recordingNotes.forEach((n, i) => {
        setTimeout(() => {
            playPianoNote(n.note);
        }, n.time - startTime);
    });
}

function clearRecording() {
    recordingNotes = [];
    document.getElementById('playBtn').style.display = 'none';
    document.getElementById('recStatus').textContent = '已清除';
}

// 覆蓋原來的鋼琴按鈕
document.querySelector('.mode-grid').innerHTML = document.querySelector('.mode-grid').innerHTML.replace('onclick="showPiano()"', 'onclick="showAdvancedPiano()"');
</script>

<script>
// ========== 節奏遊戲 ==========

function showRhythmGame() {
    const rhythmGameHTML = `
        <div id="rhythmGame" style="position:fixed;top:0;left:0;right:0;bottom:0;background:linear-gradient(180deg,#0d0d1a,#1a1a2e);z-index:3000;">
            <div style="padding:20px;text-align:center;">
                <div style="display:flex;justify-content:space-between;align-items:center;">
                    <button onclick="closeRhythmGame()" style="background:none;border:none;color:white;font-size:1.5rem;cursor:pointer;">✕</button>
                    <h2 style="color:#ffd700;">🥁 節奏遊戲</h2>
                    <div></div>
                </div>
                
                <div style="margin:20px 0;">
                    <div style="font-size:3rem;margin-bottom:20px;">🎵</div>
                    <div id="rhythmScore" style="font-size:2rem;color:#ffd700;">0</div>
                    <div style="color:#888;">分數</div>
                </div>
                
                <div id="rhythmArea" style="height:300px;position:relative;background:rgba(255,255,255,0.1);border-radius:20px;margin:20px 0;overflow:hidden;">
                    <div id="beatLine" style="position:absolute;bottom:50px;left:0;right:0;height:5px;background:linear-gradient(90deg,transparent,#00bfff,transparent);"></div>
                </div>
                
                <div style="display:flex;gap:20px;justify-content:center;">
                    <button id="tapBtn" ontouchstart="tapBeat(event)" onmousedown="tapBeat(event)" style="width:120px;height:120px;border-radius:50%;background:linear-gradient(135deg,#e94560,#ff6b6b);border:none;color:white;font-size:1.5rem;font-weight:bold;cursor:pointer;box-shadow:0 5px 30px rgba(233,69,96,0.5);">TAP!</button>
                </div>
                
                <div style="margin-top:20px;color:#888;">
                    節奏：<span id="bpmDisplay">60</span> BPM
                </div>
                
                <button onclick="startRhythmGame()" id="startRhythmBtn" style="margin-top:20px;padding:15px 40px;background:linear-gradient(135deg,#4caf50,#8bc34a);border:none;border-radius:30px;color:white;font-size:1.2rem;cursor:pointer;">▶️ 開始</button>
            </div>
        </div>
    `;
    document.body.insertAdjacentHTML('beforeend', rhythmGameHTML);
}

let rhythmScore = 0;
let rhythmRunning = false;
let bpm = 60;
let beatInterval = null;
let lastBeatTime = 0;
let perfectCount = 0;

function startRhythmGame() {
    rhythmScore = 0;
    perfectCount = 0;
    rhythmRunning = true;
    document.getElementById('rhythmScore').textContent = '0';
    document.getElementById('startRhythmBtn').style.display = 'none';
    
    // 開始節拍
    beatInterval = setInterval(() => {
        spawnBeat();
    }, 60000 / bpm);
}

function spawnBeat() {
    const area = document.getElementById('rhythmArea');
    const beat = document.createElement('div');
    beat.style.cssText = 'position:absolute;width:60px;height:60px;background:linear-gradient(135deg,#00bfff,#0099cc);border-radius:50%;left:50%;bottom:50px;transform:translateX(-50%);animation:beatFall 1.5s linear forwards;';
    beat.id = 'activeBeat';
    area.appendChild(beat);
    
    setTimeout(() => {
        if (beat.parentNode) {
            beat.remove();
            // 錯過
            perfectCount = 0;
        }
    }, 1500);
}

function tapBeat(e) {
    if (!rhythmRunning) return;
    e.preventDefault();
    
    const now = Date.now();
    const beat = document.getElementById('activeBeat');
    
    if (beat) {
        const rect = beat.getBoundingClientRect();
        const lineY = document.getElementById('rhythmArea').getBoundingClientRect().bottom - 50;
        const diff = Math.abs(rect.bottom - lineY);
        
        if (diff < 30) {
            // Perfect!
            rhythmScore += 100;
            perfectCount++;
            showRhythmFeedback('PERFECT!', '#4caf50');
            beat.remove();
        } else if (diff < 60) {
            // Good
            rhythmScore += 50;
            perfectCount++;
            showRhythmFeedback('GOOD', '#ffd700');
            beat.remove();
        } else {
            // Miss
            perfectCount = 0;
            showRhythmFeedback('MISS', '#f44336');
        }
    } else {
        // 提前按
        if (now - lastBeatTime < 300) {
            rhythmScore -= 10;
            showRhythmFeedback('TOO EARLY', '#f44336');
        }
    }
    
    lastBeatTime = now;
    document.getElementById('rhythmScore').textContent = rhythmScore;
    
    // 連擊加成
    if (perfectCount > 5) {
        rhythmScore += 10;
    }
}

function showRhythmFeedback(text, color) {
    const area = document.getElementById('rhythmArea');
    const feedback = document.createElement('div');
    feedback.style.cssText = 'position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:2rem;font-weight:bold;color:' + color + ';animation:feedbackPop 0.5s forwards;z-index:10;';
    feedback.textContent = text;
    area.appendChild(feedback);
    
    setTimeout(() => feedback.remove(), 500);
}

function closeRhythmGame() {
    rhythmRunning = false;
    clearInterval(beatInterval);
    document.getElementById('rhythmGame').remove();
}

// 添加 CSS
const rhythmCSS = document.createElement('style');
rhythmCSS.textContent = '@keyframes beatFall { 0% { bottom: 300px; opacity: 0; } 20% { opacity: 1; } 100% { bottom: 50px; opacity: 1; } } @keyframes feedbackPop { 0% { transform:translate(-50%,-50%) scale(0); } 50% { transform:translate(-50%,-50%) scale(1.2); } 100% { transform:translate(-50%,-50%) scale(1); opacity: 0; } }';
document.head.appendChild(rhythmCSS);

// 添加按鈕
document.querySelector('.mode-grid').innerHTML += '<div class="mode-card" onclick="showRhythmGame()"><div class="icon">🥁</div><div class="name">節奏遊戲</div><div class="desc">敲擊節拍！</div></div>';
</script>

function loadDailyChallenges() {
    const today = new Date().toISOString().split('T')[0];
    const saved = JSON.parse(localStorage.getItem('dailyChallenges_' + today) || 'null');
    
    if (!saved || saved.date !== today) {
        // 隨機選擇 3 個挑戰
        const shuffled = [...dailyChallenges].sort(() => 0.5 - Math.random());
        const selected = shuffled.slice(0, 3);
        
        const newData = {
            date: today,
            challenges: selected.map(c => ({ ...c, progress: 0, completed: false }))
        };
        
        localStorage.setItem('dailyChallenges_' + today, JSON.stringify(newData));
        return newData;
    }
    
    return saved;
}

            </div>
        </div>
    `;
    document.body.insertAdjacentHTML('beforeend', html);
}

function updateDailyChallengeProgress(mode, amount) {
    const today = new Date().toISOString().split('T')[0];
    const data = loadDailyChallenges();
    
    let allComplete = true;
    let totalReward = 0;
    
    data.challenges.forEach(c => {
        if (!c.completed) {
            if ((c.mode === mode || c.mode === 'score') && c.progress < c.target) {
                c.progress += amount;
                if (c.progress >= c.target) {
                    c.completed = true;
                    totalReward += c.reward;
                }
            }
            if (!c.completed) allComplete = false;
        }
    });
    
    // 全部完成額外獎勵
    if (allComplete && !data.allComplete) {
        totalReward += 100;
        data.allComplete = true;
    }
    
    if (totalReward > 0) {
        playerData.coins += totalReward;
        saveData();
        showFeedback('+' + totalReward + '💰 每日挑戰！', '#ffd700');
    }
    
    localStorage.setItem('dailyChallenges_' + today, JSON.stringify(data));
}

// 監控答題進度
const oldCheckAnswer = checkAnswer;
checkAnswer = function(answer, correct) {
    oldCheckAnswer(answer, correct);
    
    if (correct && (currentMode === 'ear' || currentMode === 'note' || currentMode === 'rhythm' || currentMode === 'chord')) {
        updateDailyChallengeProgress(currentMode, 1);
    }
    
    if (gameScore >= 500) {
        updateDailyChallengeProgress('score', gameScore);
    }
};

playPianoNote = function(note) {

};

<script>
// ========== 練習連勝系統 ==========

function updatePracticeStreak() {
    const today = new Date().toISOString().split('T')[0];
    const lastPractice = localStorage.getItem('lastPracticeDate');
    const streak = parseInt(localStorage.getItem('practiceStreak') || '0');
    
    if (lastPractice !== today) {
        const yesterday = new Date();
        yesterday.setDate(yesterday.getDate() - 1);
        const yesterdayStr = yesterday.toISOString().split('T')[0];
        
        let newStreak;
        if (lastPractice === yesterdayStr) {
            newStreak = streak + 1;
        } else {
            newStreak = 1;
        }
        
        localStorage.setItem('practiceStreak', newStreak);
        localStorage.setItem('lastPracticeDate', today);
        
        // 顯示連勝獎勵
        if (newStreak > 1) {
            const streakBonus = newStreak * 10;
            playerData.coins += streakBonus;
            playerData.xp += newStreak * 5;
            saveData();
            
            setTimeout(() => {
                showStreakPopup(newStreak, streakBonus);
            }, 1000);
        }
    }
}

function showStreakPopup(streak, bonus) {
    const el = document.createElement('div');
    el.style.cssText = 'position:fixed;top:30%;left:50%;transform:translateX(-50%);background:linear-gradient(135deg,#ff6b6b,#ffd700);color:#000;padding:20px 40px;border-radius:20px;font-size:1.5rem;font-weight:bold;z-index:6000;animation:streakPop 2s forwards;text-align:center;';
    el.innerHTML = `🔥 ${streak} 天連勝！<br><span style="font-size:1rem;">+${bonus}💰</span>`;
    document.body.appendChild(el);
    
    // 煙火

}

<script>
// ========== 記憶力訓練 ==========

function showMemoryGame() {
    const notes4 = ['Do', 'Re', 'Mi', 'Fa', 'Sol', 'La'];
    const cards = [...notes4, ...notes4].sort(() => Math.random() - 0.5);
    
    const memoryHTML = `
        <div id="memoryPanel" style="position:fixed;top:0;left:0;right:0;bottom:0;background:linear-gradient(135deg,#1a1a2e,#0d0d1a);z-index:3500;overflow-y:auto;">
            <div style="padding:20px;max-width:400px;margin:0 auto;">
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
                    <h2 style="color:#ffd700;">🧠 記憶力訓練</h2>
                    <button onclick="document.getElementById('memoryPanel').remove()" style="background:none;border:none;color:white;font-size:1.5rem;cursor:pointer;">✕</button>
                </div>
                
                <div style="text-align:center;margin-bottom:15px;">
                    <span style="color:#ffd700;font-size:1.2rem;">${0}</span> 回合
                </div>
                
                <div id="memoryGrid" style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;">
                    ${cards.map((note, i) => `
                        <div class="memory-card" onclick="flipCard(this,'${note}',${i})" style="height:80px;background:linear-gradient(135deg,#e94560,#ff6b6b);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:2rem;cursor:pointer;transform:scale(1);transition:transform 0.3s;">
                            ❓
                        </div>
                    `).join('')}
                </div>
                
                <div style="text-align:center;margin-top:20px;color:#888;">
                    翻出相同的音符！
                </div>
            </div>
        </div>
    `;
    document.body.insertAdjacentHTML('beforeend', memoryHTML);
}

let flippedCards = [];
let matchedPairs = 0;
let moves = 0;

function flipCard(el, note, index) {
    if (el.classList.contains('flipped') || flippedCards.length >= 2) return;
    
    el.classList.add('flipped');
    el.style.background = 'linear-gradient(135deg,#4caf50,#8bc34a)';
    el.textContent = note;
    el.dataset.note = note;
    
    flippedCards.push({ el, note, index });
    
    if (flippedCards.length === 2) {
        moves++;
        document.querySelector('#memoryPanel span').textContent = moves;
        
        const [card1, card2] = flippedCards;
        
        if (card1.note === card2.note) {
            // 配對成功
            matchedPairs++;
            card1.el.style.opacity = '0.5';
            card2.el.style.opacity = '0.5';
            card1.el.style.cursor = 'default';
            card2.el.style.cursor = 'default';
            flippedCards = [];
            
            playSound('correct');
            
            if (matchedPairs === 6) {
                setTimeout(() => {
                    const reward = 50 - moves * 2;
                    playerData.coins += Math.max(10, reward);
                    playerData.xp += 20;
                    saveData();
                    
                    showFeedback(`🎉 完成！+${Math.max(10, reward)}💰`, '#ffd700');
                }, 500);
            }
        } else {
            // 配對失敗
            setTimeout(() => {
                card1.el.classList.remove('flipped');
                card2.el.classList.remove('flipped');
                card1.el.style.background = 'linear-gradient(135deg,#e94560,#ff6b6b)';
                card2.el.style.background = 'linear-gradient(135deg,#e94560,#ff6b6b)';
                card1.el.textContent = '❓';
                card2.el.textContent = '❓';
                flippedCards = [];
            }, 800);
            playSound('wrong');
        }
    }
}

// 添加按鈕
document.querySelector('.mode-grid').innerHTML += '<div class="mode-card" onclick="showMemoryGame()"><div class="icon">🧠</div><div class="name">記憶訓練</div><div class="desc">翻牌配對練習</div></div>';
</script>

<script>
// ========== 音效系統增強 ==========

// 更豐富的音效
function playEnhancedSound(type) {
    if (!soundOn) return;
    
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    
    switch(type) {
        case 'correct':
            osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5
            osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1); // E5
            osc.type = 'sine';
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.2);
            break;
            
        case 'wrong':
            osc.frequency.setValueAtTime(200, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.3);
            osc.type = 'sawtooth';
            gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.3);
            break;
            
        case 'coin':
            osc.frequency.setValueAtTime(1200, audioCtx.currentTime);
            osc.type = 'sine';
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.08);
            break;
            
        case 'levelup':
            const notes = [523.25, 659.25, 783.99, 1046.50];
            notes.forEach((freq, i) => {
                const o = audioCtx.createOscillator();
                const g = audioCtx.createGain();
                o.connect(g);
                g.connect(audioCtx.destination);
                o.frequency.value = freq;
                o.type = 'square';
                g.gain.setValueAtTime(0.1, audioCtx.currentTime + i * 0.1);
                g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + i * 0.1 + 0.15);
                o.start(audioCtx.currentTime + i * 0.1);
                o.stop(audioCtx.currentTime + i * 0.1 + 0.15);
            });
            return;
            
        case 'click':
            osc.frequency.value = 800;
            osc.type = 'sine';
            gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.05);
            break;
    }
    
    vibrate(type === 'correct' ? 30 : type === 'wrong' ? 80 : 20);
}

// 覆蓋原有函數
const oldPlaySound = playSound;
playSound = function(type) {
    if (soundOn) {
        playEnhancedSound(type);
    }
};

// 按鈕點擊音效
document.addEventListener('click', function(e) {
    if (e.target.tagName === 'BUTTON') {
        playEnhancedSound('click');
    }
}, { passive: true });
</script>

        correct += s.correct;
    }
    return { questions, correct };
}

};

                    <div style="display:flex;justify-content:space-between;padding:10px;background:rgba(255,255,255,0.1);border-radius:8px;">
                        <span>和弦練習</span><span style="color:#ffd700;">4</span>

                    <div style="display:flex;justify-content:space-between;padding:10px;background:rgba(255,255,255,0.1);border-radius:8px;">

<script>
// ========== 搜尋功能 ==========

function showSearch() {
    const searchHTML = `
        <div id="searchPanel" style="position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.95);z-index:4000;display:flex;align-items:flex-start;justify-content:center;padding-top:50px;">
            <div style="width:90%;max-width:400px;">
                <input type="text" id="searchInput" placeholder="搜尋功能..." oninput="searchFeatures(this.value)" style="width:100%;padding:15px;font-size:1.1rem;border:none;border-radius:10px;background:rgba(255,255,255,0.2);color:white;outline:none;">
                <div id="searchResults" style="margin-top:20px;"></div>
            </div>
        </div>
    `;
    document.body.insertAdjacentHTML('beforeend', searchHTML);
    document.getElementById('searchInput').focus();
}

function searchFeatures(query) {
    if (!query) {
        document.getElementById('searchResults').innerHTML = '';
        return;
    }
    
    const features = [
        { name: '听力大師', desc: '聽聲音猜音符', action: "startGame('ear')" },
        { name: '音符認識', desc: '認識音名與唱名', action: "startGame('note')" },
        { name: '節奏訓練', desc: '學習各種音符時值', action: "startGame('rhythm')" },
        { name: '和弦教室', desc: '認識和弦組成', action: "startGame('chord')" },
        { name: '音階練習', desc: '大小調音階', action: "startGame('scale')" },
        { name: '鋼琴', desc: '自由彈奏鋼琴', action: 'showAdvancedPiano()' },
        { name: '歌曲庫', desc: '經典歌曲練習', action: 'showSongLibrary()' },
        { name: '節奏遊戲', desc: '敲擊節拍', action: 'showRhythmGame()' },
        { name: '音樂知識', desc: '音樂素養問答', action: 'showMusicQuiz()' },
        { name: '記憶訓練', desc: '翻牌配對遊戲', action: 'showMemoryGame()' },
        { name: '設置', desc: '設定音效、亮度', action: 'showSettings()' },
        { name: '主題', desc: '更換外觀主題', action: 'showThemeSelector()' }
    ];
    
    const results = features.filter(f => 
        f.name.toLowerCase().includes(query.toLowerCase()) || 
        f.desc.toLowerCase().includes(query.toLowerCase())
    );
    
    document.getElementById('searchResults').innerHTML = results.map(f => `
        <div onclick="${f.action};document.getElementById('searchPanel').remove();" style="background:rgba(255,255,255,0.1);padding:15px;border-radius:10px;margin:10px 0;cursor:pointer;">
            <div style="font-weight:bold;">${f.name}</div>
            <div style="font-size:0.8rem;opacity:0.7;">${f.desc}</div>
        </div>
    `).join('') || '<div style="color:#888;text-align:center;">沒有找到結果</div>';
}

// 添加搜尋按鈕
document.querySelector('h1').insertAdjacentHTML('afterend', '<button onclick="showSearch()" style="position:fixed;top:15px;right:80px;background:rgba(255,255,255,0.2);border:none;border-radius:50%;width:40px;height:40px;font-size:1.2rem;cursor:pointer;">🔍</button>');
</script>

<script>
// ========== 浮動背景特效 ==========

function addFloatingBackground() {
    const bg = document.createElement('div');
    bg.id = 'floatingBg';
    bg.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;pointer-events:none;z-index:-1;overflow:hidden;';
    
    // 添加浮動音符
    const notes = ['🎵', '🎶', '🎼', '🎹', '🎸', '🎷', '🎺', '🎻'];
    for (let i = 0; i < 15; i++) {
        const note = document.createElement('div');
        note.textContent = notes[Math.floor(Math.random() * notes.length)];
        note.style.cssText = `
            position:absolute;
            font-size: ${20 + Math.random() * 30}px;
            opacity: ${0.1 + Math.random() * 0.2};
            left: ${Math.random() * 100}vw;
            top: ${Math.random() * 100}vh;
            animation: floatBg ${10 + Math.random() * 20}s linear infinite;
            animation-delay: -${Math.random() * 20}s;
        `;
        bg.appendChild(note);
    }
    
    document.body.insertBefore(bg, document.body.firstChild);
}

// 添加 CSS
const bgCSS = document.createElement('style');
bgCSS.textContent = '@keyframes floatBg { 0% { transform: translateY(0) rotate(0deg); } 100% { transform: translateY(-100vh) rotate(360deg); } }';
document.head.appendChild(bgCSS);

// 初始化
addFloatingBackground();
</script>

<script>
// ========== 每日獎勵動畫 ==========

function showDailyRewardAnimation() {
    const lastReward = localStorage.getItem('dailyRewardTime');
    const now = Date.now();
    const dayMs = 24 * 60 * 60 * 1000;
    
    if (!lastReward || now - lastReward > dayMs) {
        // 顯示獎勵動畫
        setTimeout(() => {
            const rewardEl = document.createElement('div');
            rewardEl.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.8);z-index:8000;display:flex;flex-direction:column;align-items:center;justify-content:center;';
            rewardEl.innerHTML = `
                <div style="font-size:4rem;animation:bounce 0.5s infinite;">🎁</div>
                <div style="font-size:2rem;color:#ffd700;margin:20px 0;">每日登入獎勵！</div>
                <div style="font-size:3rem;color:#ffd700;">+50 💰</div>
            `;
            document.body.appendChild(rewardEl);
            
            // 煙火
            for (let i = 0; i < 30; i++) {
                setTimeout(() => createConfetti(), i * 50);
            }
            
            setTimeout(() => {
                rewardEl.remove();
                localStorage.setItem('dailyRewardTime', now);
            }, 3000);
        }, 2000);
    }
}

// 添加動畫樣式
const rewardCSS = document.createElement('style');
rewardCSS.textContent = '@keyframes bounce { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-20px); } }';
document.head.appendChild(rewardCSS);

// 初始化
showDailyRewardAnimation();
</script>
