<script>
// ========== 練習歷史 ==========

function showPracticeHistory() {
    const history = JSON.parse(localStorage.getItem('practiceHistory') || '[]');
    
    let html = `
        <div id="historyPanel" style="position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.95);z-index:4500;overflow-y:auto;">
            <div style="padding:20px;max-width:400px;margin:0 auto;">
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
                    <h2 style="color:#ffd700;">📜 練習歷史</h2>
                    <button onclick="document.getElementById('historyPanel').remove()" style="background:none;border:none;color:white;font-size:1.5rem;cursor:pointer;">✕</button>
                </div>
                
                ${history.length === 0 ? '<div style="text-align:center;color:#888;padding:30px;">尚無練習記錄</div>' : ''}
    `;
    
    // 顯示最近20筆記錄
    history.slice(-20).reverse().forEach(h => {
        const isCorrect = h.correct ? '✅' : '❌';
        const date = new Date(h.time).toLocaleTimeString();
        html += `
            <div style="background:rgba(255,255,255,0.1);padding:15px;border-radius:10px;margin:10px 0;display:flex;justify-content:space-between;align-items:center;">
                <div>
                    <div style="font-weight:bold;">${h.question}</div>
                    <div style="font-size:0.8rem;color:#888;">${date}</div>
                </div>
                <div style="font-size:1.5rem;">${isCorrect}</div>
            </div>
        `;
    });
    
    html += `
                <button onclick="clearHistory()" style="width:100%;padding:12px;background:#f44336;border:none;border-radius:10px;color:white;cursor:pointer;margin-top:15px;">清除記錄</button>
            </div>
        </div>
    `;
    document.body.insertAdjacentHTML('beforeend', html);
}

function addHistory(question, correct, userAnswer) {
    const history = JSON.parse(localStorage.getItem('practiceHistory') || '[]');
    history.push({
        question: question,
        correct: correct,
        userAnswer: userAnswer,
        time: Date.now()
    });
    // 只保留最近100筆記錄
    if (history.length > 100) history.shift();
    localStorage.setItem("practiceHistory", JSON.stringify(history));
}

function clearHistory() {
    if (confirm('確定清除所有練習記錄？')) {
        localStorage.removeItem('practiceHistory');
        showPracticeHistory();
    }
}

// 修改答題函式記錄歷史
const oldCheckAnswer4 = checkAnswer;
checkAnswer = function(answer, correct) {
    oldCheckAnswer4(answer, correct);
    addHistory(currentQuestion, String(answer) === String(correct), answer);
};

// 添加按鈕
document.querySelector('.tab-buttons').insertAdjacentHTML('beforeend', '<button class="tab-btn" onclick="showPracticeHistory()">📜</button>');
</script>

<script>
// ========== 練習報告 ==========

function showPracticeReport() {
    const history = JSON.parse(localStorage.getItem('practiceHistory') || '[]');
    
    if (history.length === 0) {
        showFeedback('尚無練習記錄！', '#888');
        return;
    }
    
    // 統計正確率
    const stats = {
        ear: { correct: 0, total: 0 },
        note: { correct: 0, total: 0 },
        rhythm: { correct: 0, total: 0 },
        chord: { correct: 0, total: 0 },
        scale: { correct: 0, total: 0 }
    };
    
    history.forEach(h => {
        // 根據題目內容判斷類型
        if (h.question.includes('音符') || h.question.includes('Do') || h.question.includes('Re')) {
            stats.note.total++;
            if (h.correct) stats.note.correct++;
        } else if (h.question.includes('拍') || h.question.includes('節奏')) {
            stats.rhythm.total++;
            if (h.correct) stats.rhythm.correct++;
        } else if (h.question.includes('和弦')) {
            stats.chord.total++;
            if (h.correct) stats.chord.correct++;
        } else if (h.question.includes('音階')) {
            stats.scale.total++;
            if (h.correct) stats.scale.correct++;
        } else {
            stats.ear.total++;
            if (h.correct) stats.ear.correct++;
        }
    });
    
    const total = history.length;
    const correctCount = history.filter(h => h.correct).length;
    const accuracy = Math.round((correctCount / total) * 100);
    
    // 找出最弱的項目
    let weakest = 'ear';
    let weakestRate = 100;
    Object.entries(stats).forEach(([key, val]) => {
        if (val.total > 0) {
            const rate = Math.round((val.correct / val.total) * 100);
            if (rate < weakestRate) {
                weakestRate = rate;
                weakest = key;
            }
        }
    });
    
    const names = { ear: '聽力', note: '音符', rhythm: '節奏', chord: '和弦', scale: '音階' };
    const icons = { ear: '👂', note: '🎵', rhythm: '🥁', chord: '🎹', scale: '🎼' };
    
    const html = `
        <div id="reportPanel" style="position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.95);z-index:4600;overflow-y:auto;">
            <div style="padding:20px;max-width:400px;margin:0 auto;">
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
                    <h2 style="color:#ffd700;">📊 練習報告</h2>
                    <button onclick="document.getElementById('reportPanel').remove()" style="background:none;border:none;color:white;font-size:1.5rem;cursor:pointer;">✕</button>
                </div>
                
                <div style="background:linear-gradient(135deg,#ffd700,#ff8c00);padding:25px;border-radius:15px;text-align:center;margin-bottom:20px;">
                    <div style="font-size:3rem;font-weight:bold;">${accuracy}%</div>
                    <div style="font-size:1rem;">總正確率</div>
                    <div style="font-size:0.8rem;margin-top:10px;">${correctCount} / ${total} 題</div>
                </div>
                
                <div style="background:rgba(255,255,255,0.1);padding:20px;border-radius:15px;margin-bottom:15px;">
                    <div style="font-weight:bold;margin-bottom:15px;">各類正確率</div>
                    ${Object.entries(stats).map(([key, val]) => {
                        const rate = val.total > 0 ? Math.round((val.correct / val.total) * 100) : 0;
                        const color = rate >= 80 ? '#4caf50' : rate >= 60 ? '#ff9800' : '#f44336';
                        return `
                            <div style="display:flex;align-items:center;gap:10px;margin:10px 0;">
                                <span style="font-size:1.5rem;">${icons[key]}</span>
                                <span style="flex:1;">${names[key]}</span>
                                <span style="color:${color};font-weight:bold;">${rate}%</span>
                            </div>
                            <div style="height:5px;background:rgba(255,255,255,0.2);border-radius:3px;overflow:hidden;">
                                <div style="height:100%;width:${rate}%;background:${color};transition:width 0.5s;"></div>
                            </div>
                        `;
                    }).join('')}
                </div>
                
                <div style="background:rgba(255,255,255,0.1);padding:20px;border-radius:15px;">
                    <div style="font-weight:bold;margin-bottom:10px;">💡 建議</div>
                    <div style="color:#ccc;">
                        ${weakestRate < 80 ? `需要多加練習「${names[weakest]}」！` : '太棒了！所有項目都很強！'}
                    </div>
                </div>
                
                <button onclick="document.getElementById('reportPanel').remove();startGame('${weakest}');" style="width:100%;padding:15px;background:linear-gradient(135deg,#4caf50,#8bc34a);border:none;border-radius:10px;color:white;font-size:1.1rem;font-weight:bold;cursor:pointer;margin-top:20px;">開始練習 💪</button>
            </div>
        </div>
    `;
    document.body.insertAdjacentHTML('beforeend', html);
}
</script>

<script>
// ========== 錯題複習 ==========

function showMistakeReview() {
    const history = JSON.parse(localStorage.getItem('practiceHistory') || '[]');
    const mistakes = history.filter(h => !h.correct);
    
    if (mistakes.length === 0) {
        showFeedback('太棒了！沒有錯題！', '#4caf50');
        return;
    }
    
    const mistake = mistakes[Math.floor(Math.random() * mistakes.length)];
    
    // 根據題目類型生成複習
    let questionHTML = '';
    let correctAnswer = '';
    
    if (mistake.question.includes('拍') || mistake.question.includes('節奏')) {
        // 節奏題
        const rhythms2 = [
            { name: '全音符', beats: 4 },
            { name: '二分音符', beats: 2 },
            { name: '四分音符', beats: 1 },
            { name: '八分音符', beats: 0.5 }
        ];
        const r = rhythms2.find(r => mistake.question.includes(r.name)) || rhythms2[Math.floor(Math.random() * 4)];
        correctAnswer = r.beats;
        
        questionHTML = `
            <div style="background:rgba(255,255,255,0.1);padding:30px;border-radius:15px;text-align:center;">
                <div style="font-size:1.2rem;margin-bottom:15px;">複習：${r.name}</div>
                <div class="options-grid">
                    ${[0.5,1,2,4].map(n => 
                        '<button class="option-btn" onclick="checkMistake(' + n + ',' + r.beats + ')">' + n + ' 拍</button>'
                    ).join('')}
                </div>
            </div>
        `;
    } else if (mistake.question.includes('和弦')) {
        // 和弦題
        const chords2 = ['C', 'G', 'F', 'Am', 'Dm', 'Em'];
        const c = chords2[Math.floor(Math.random() * chords2.length)];
        correctAnswer = c;
        
        questionHTML = `
            <div style="background:rgba(255,255,255,0.1);padding:30px;border-radius:15px;text-align:center;">
                <div style="font-size:1.2rem;margin-bottom:15px;">這是什麼和弦？</div>
                <div class="options-grid">
                    ${chords2.map(n => 
                        '<button class="option-btn" onclick="checkMistake(\'' + n + '\',\'' + c + '\')">' + n + '</button>'
                    ).join('')}
                </div>
            </div>
        `;
    } else {
        // 音符題
        const notes2 = ['Do', 'Re', 'Mi', 'Fa', 'Sol', 'La', 'Si'];
        const n = notes2[Math.floor(Math.random() * notes2.length)];
        correctAnswer = n;
        
        questionHTML = `
            <div style="background:rgba(255,255,255,0.1);padding:30px;border-radius:15px;text-align:center;">
                <div style="font-size:3rem;margin-bottom:15px;">${n}</div>
                <div class="options-grid">
                    ${notes2.map(note => 
                        '<button class="option-btn" onclick="checkMistake(\'' + note + '\',\'' + n + '\')">' + note + '</button>'
                    ).join('')}
                </div>
            </div>
        `;
    }
    
    const html = `
        <div id="mistakePanel" style="position:fixed;top:0;left:0;right:0;bottom:0;background:linear-gradient(135deg,#1a1a2e,#0d0d1a);z-index:4700;display:flex;align-items:center;justify-content:center;">
            <div style="width:90%;max-width:400px;">
                <h2 style="color:#ffd700;text-align:center;margin-bottom:20px;">📝 錯題複習</h2>
                <p style="color:#888;text-align:center;margin-bottom:20px;">你有 ${mistakes.length} 題錯過的題目</p>
                ${questionHTML}
                <button onclick="showMistakeReview()" style="width:100%;padding:12px;background:rgba(255,255,255,0.2);border:none;border-radius:10px;color:#888;cursor:pointer;margin-top:15px;">下一題</button>
                <button onclick="document.getElementById('mistakePanel').remove()" style="width:100%;padding:12px;background:transparent;border:none;color:#666;cursor:pointer;margin-top:10px;">關閉</button>
            </div>
        </div>
    `;
    document.body.insertAdjacentHTML('beforeend', html);
}

function checkMistake(answer, correct) {
    const isCorrect = String(answer) === String(correct);
    
    if (isCorrect) {
        showFeedback('答對了！👏', '#4caf50');
        setTimeout(() => {
            document.getElementById('mistakePanel').remove();
            showMistakeReview();
        }, 1000);
    } else {
        showFeedback('再想想！💪', '#ff9800');
    }
}
</script>

<script>
// ========== 響應式設計 ==========

function adjustLayout() {
    const width = window.innerWidth;
    const height = window.innerHeight;
    
    // 調整字體大小
    let baseFontSize = 16;
    let titleSize = '2rem';
    let cardPadding = '20px';
    let buttonPadding = '15px';
    
    if (width < 400) {
        // 小手機
        baseFontSize = 14;
        titleSize = '1.5rem';
        cardPadding = '12px';
        buttonPadding = '10px';
    } else if (width < 600) {
        // 一般手機
        baseFontSize = 15;
        titleSize = '1.8rem';
        cardPadding = '15px';
        buttonPadding = '12px';
    } else if (width > 1000) {
        // 平板/電腦
        baseFontSize = 18;
        titleSize = '2.5rem';
        cardPadding = '25px';
        buttonPadding = '18px';
    }
    
    // 動態調整根元素字體
    document.documentElement.style.fontSize = baseFontSize + 'px';
    
    // 調整標題
    const h1 = document.querySelector('h1');
    if (h1) h1.style.fontSize = titleSize;
    
    // 調整遊戲卡片
    const cards = document.querySelectorAll('.mode-card');
    cards.forEach(card => {
        card.style.padding = cardPadding;
    });
    
    // 調整按鈕
    const buttons = document.querySelectorAll('.option-btn');
    buttons.forEach(btn => {
        btn.style.padding = buttonPadding;
    });
    
    // 調整網格
    const grids = document.querySelectorAll('.mode-grid, .options-grid');
    grids.forEach(grid => {
        if (width < 400) {
            grid.style.gridTemplateColumns = 'repeat(2, 1fr)';
            grid.style.gap = '8px';
        } else if (width < 600) {
            grid.style.gridTemplateColumns = 'repeat(2, 1fr)';
            grid.style.gap = '12px';
        } else {
            grid.style.gridTemplateColumns = 'repeat(3, 1fr)';
            grid.style.gap = '15px';
        }
    });
    
    // 調整統計列
    const statsRow = document.querySelector('.stats-row');
    if (statsRow) {
        if (width < 400) {
            statsRow.style.gap = '8px';
        } else {
            statsRow.style.gap = '15px';
        }
    }
    
    // 調整音符顯示
    const noteDisplay = document.querySelector('.note-display');
    if (noteDisplay) {
        if (width < 400) {
            noteDisplay.style.fontSize = '4rem';
        } else if (width < 600) {
            noteDisplay.style.fontSize = '5rem';
        } else {
            noteDisplay.style.fontSize = '7rem';
        }
    }
}

// 監聽視窗大小變化
window.addEventListener('resize', adjustLayout);
window.addEventListener('load', adjustLayout);

// 初始化
setTimeout(adjustLayout, 100);
</script>

<script>
// ========== 浮動幫助按鈕 ==========
function showHelp() {
    const html = '<div id="helpPanel" style="position:fixed;bottom:20px;left:20px;width:50px;height:50px;background:linear-gradient(135deg,#2196f3,#03a9f4);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.5rem;cursor:pointer;z-index:1000;box-shadow:0 4px 15px rgba(0,0,0,0.3);" onclick="showHelpDialog()">❓</div>';
    document.body.insertAdjacentHTML('beforeend', html);
}
function showHelpDialog() {
    // 可訪問性：儲存當前聚焦的元素
    lastFocusedElement = document.activeElement;
    
    const d = document.createElement('div');
    d.id = 'helpModal';
    d.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.8);z-index:9999;display:flex;align-items:center;justify-content:center;';
    d.setAttribute('role', 'dialog');
    d.setAttribute('aria-modal', 'true');
    d.setAttribute('aria-labelledby', 'helpModalTitle');
    d.innerHTML = '<div style="background:linear-gradient(135deg,#1a1a2e,#16213e);padding:30px;border-radius:20px;max-width:350px;text-align:center;"><h2 id="helpModalTitle" style="color:#ffd700;margin-bottom:15px;">🎵 音樂達人</h2><p style="color:#ccc;margin:10px 0;">⚡ 快速開始</p><p style="color:#ccc;margin:10px 0;">📋 查看任務</p><p style="color:#ccc;margin:10px 0;">⚙️ 設定功能</p><button id="helpModalCloseBtn" onclick="closeHelpDialog()" style="margin-top:20px;padding:10px 30px;background:#2196f3;border:none;border-radius:10px;color:white;cursor:pointer;font-size:1rem;">關閉</button></div>';
    document.body.appendChild(d);
    // 可訪問性：聚焦到關閉按鈕
    setTimeout(() => document.getElementById('helpModalCloseBtn')?.focus(), 100);
}

function closeHelpDialog() {
    const d = document.getElementById('helpModal');
    if (d) d.remove();
    // 可訪問性：關閉後恢復焦點到原本的元素
    if (lastFocusedElement && lastFocusedElement.focus) {
        setTimeout(() => lastFocusedElement.focus(), 50);
    }
}
</script>
