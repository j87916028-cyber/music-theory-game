    <script>
    // ========== Service Worker 註冊與更新監控 ==========
    if ('serviceWorker' in navigator) {
        // 註冊 Service Worker
        navigator.serviceWorker.register('./sw.js')
            .then(reg => {
                console.log('Service Worker 已註冊:', reg.scope);
                
                // 檢查更新（每次頁面載入時）
                reg.update();
                
                // 監聽更新
                reg.addEventListener('updatefound', () => {
                    const newWorker = reg.installing;
                    newWorker.addEventListener('statechange', () => {
                        if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                            // 有新版本可用
                            showUpdateNotification();
                        }
                    });
                });
            })
            .catch(err => console.warn('Service Worker 註冊失敗:', err));
        
        // 監聽 Service Worker 訊息
        navigator.serviceWorker.addEventListener('message', event => {
            if (event.data && event.data.type === 'UPDATE_AVAILABLE') {
                showUpdateNotification(event.data.version);
            }
        });
        
        // 顯示更新提示
        function showUpdateNotification(version) {
            // 檢查是否已經顯示過更新提示（24小時內不重複顯示）
            const lastUpdateNotification = localStorage.getItem('musicGameUpdateNotification');
            const now = Date.now();
            if (lastUpdateNotification && (now - parseInt(lastUpdateNotification)) < 24 * 60 * 60 * 1000) {
                return;
            }
            
            // 顯示更新提示
            const notification = document.createElement('div');
            notification.id = 'updateNotification';
            notification.style.cssText = 'position:fixed;top:20px;right:20px;background:linear-gradient(135deg,#4caf50,#2196f3);padding:15px 20px;border-radius:15px;z-index:10000;box-shadow:0 4px 20px rgba(0,0,0,0.4);cursor:pointer;animation:float 0.5s ease;';
            notification.innerHTML = '<div style="display:flex;align-items:center;gap:10px;"><span style="font-size:1.5rem;">🔄</span><div><div style="font-weight:bold;">有新版本可用！</div><div style="font-size:0.8rem;opacity:0.9;">點擊重新整理升級</div></div></div>';
            notification.onclick = () => {
                localStorage.setItem('musicGameUpdateNotification', Date.now().toString());
                window.location.reload();
            };
            document.body.appendChild(notification);
            
            // 記錄顯示時間
            localStorage.setItem('musicGameUpdateNotification', now.toString());
            
            // 10秒後自動移除
            setTimeout(() => notification.remove(), 10000);
        }
        
        // 定時檢查更新（每5分鐘）
        setInterval(() => {
            if (navigator.serviceWorker.controller) {
                navigator.serviceWorker.controller.postMessage({ type: 'CHECK_FOR_UPDATE' });
            }
        }, 5 * 60 * 1000);
    }
    </script>

            const bossCard = getDomElement('bossCard'); const bossLock = getDomElement('bossLock');
            if (level >= 5) { bossCard.classList.remove('locked'); if (bossLock) bossLock.style.display = 'none'; }
        }
        
        function checkDailyLogin() {
            const today = new Date().toISOString().split('T')[0];
            if (playerData.lastLogin !== today) {
                if (playerData.lastLogin) { const diff = (new Date(today) - new Date(playerData.lastLogin)) / (1000 * 60 * 60 * 24); if (diff > 1) playerData.dayStreak = 0; }
                getDomElement('dailyText').textContent = '點擊領取今日獎勵！';
            } else { getDomElement('dailyText').textContent = '已連續登入 ' + playerData.dayStreak + ' 天 ✅'; getDomElement('dailyReward').style.opacity = '0.7'; }
        }
        
        function claimDailyReward() {
            const today = new Date().toISOString().split('T')[0];
            if (playerData.lastLogin === today) return;
            playerData.lastLogin = today; playerData.dayStreak++;
            const reward = 10 + playerData.dayStreak * 5; playerData.coins += reward; playerData.xp += 20;
            saveData(); showFeedback('+' + reward + '💰', '#ffd700'); updateUI();
        }
        
        function updateCollection() {
            const grid = getDomElement('instrumentCollection');
            grid.innerHTML = instruments.map(inst => {
                const owned = playerData.instruments.includes(inst.id); const equipped = playerData.equippedInstrument === inst.id; const unlocked = playerData.xp >= inst.unlockXP;
                return '<div class="collection-item ' + (owned ? 'owned' : '') + ' ' + (equipped ? 'equipped' : '') + '" onclick="' + (owned ? 'equipInstrument(\'' + inst.id + '\')' : (unlocked ? 'unlockInstrument(\'' + inst.id + '\')' : '')) + '">' + inst.emoji + '<div style="font-size:0.7rem">' + inst.name + '</div>' + (!owned && !unlocked ? '<div style="font-size:0.6rem">🔒</div>' : '') + '</div>';
            }).join('');
        }
        
        function unlockInstrument(id) {
            const inst = instruments.find(i => i.id === id);
            if (playerData.xp >= inst.unlockXP) { playerData.instruments.push(id); playerData.equippedInstrument = id; saveData(); updateUI(); showFeedback('解鎖 ' + inst.name + '！', '#4caf50'); }
        }
        function equipInstrument(id) { if (playerData.instruments.includes(id)) { playerData.equippedInstrument = id; saveData(); updateUI(); } }
        
        function updateAchievements() {
            const list = getDomElement('achievementsList');
            list.innerHTML = achievements.map(ach => {
                const unlocked = playerData.achievements.includes(ach.id);
                return '<div class="achievement-card ' + (unlocked ? 'unlocked' : '') + '"><div class="achievement-icon">' + ach.icon + '</div><div class="achievement-info"><div class="achievement-title">' + ach.name + '</div><div class="achievement-desc">' + ach.desc + '</div></div>' + (unlocked ? '<div style="font-size:1.5rem">✅</div>' : '') + '</div>';
            }).join('');
        }
        
        function updateQuests() {
            const today = new Date().toISOString().split('T')[0];
            if (playerData.dailyQuests.date !== today) {
                playerData.dailyQuests = { date: today, quests: [{ id: 'play10', desc: '回答 10 題', progress: 0, target: 10, reward: 20 }, { id: 'perfect3', desc: '3 題全對', progress: 0, target: 3, reward: 30 }, { id: 'earn50', desc: '獲得 50 金幣', progress: 0, target: 50, reward: 40 }] };
                localStorage.setItem('musicDailyQuests', JSON.stringify(playerData.dailyQuests));
            }
            const container = getDomElement('dailyQuests');
            container.innerHTML = '<h3 style="margin-bottom:15px;">📋 今日任務</h3>';
            playerData.dailyQuests.quests.forEach(q => {
                container.innerHTML += '<div class="quest-card"><div class="quest-icon">📌</div><div class="quest-info"><div class="quest-title">' + q.desc + '</div><div class="quest-progress">' + q.progress + '/' + q.target + '</div></div><div class="quest-reward">+' + q.reward + '💰</div></div>';
            });
        }
        
        function checkQuests() {
            playerData.dailyQuests.quests.forEach(q => {
                if (q.id === 'play10' && q.progress < q.target) { q.progress++; if (q.progress >= q.target) { playerData.coins += q.reward; showFeedback('+' + q.reward + '💰 任務完成！', '#ffd700'); } }
                // 修復：每輪只計算一次「3題全對」，避免重複計算
                if (q.id === 'perfect3' && correctThisRound >= 3 && q.progress < q.target && !perfectChecked) { 
                    q.progress++; 
                    perfectChecked = true; // 標記這輪已計算
                    if (q.progress >= q.target) { playerData.coins += q.reward; showFeedback('+' + q.reward + '💰 任務完成！', '#ffd700'); } 
                }
            });
            saveData(); updateQuests();
        }
        
        // 節流機制：防止快速點擊導致音頻節點堆積
        const noteThrottle = {};
        function playNote(note) {
            // 節流：每個音符 100ms 內只能播放一次
            const now = Date.now();
            if (noteThrottle[note] && now - noteThrottle[note] < 100) return;
            noteThrottle[note] = now;
            
            initAudio();
            if (!window.audioCtx || !noteFreqs[note]) { console.warn('Cannot play note:', note); return; }
            const osc = window.audioCtx.createOscillator();
            const gain = window.audioCtx.createGain();
            osc.connect(gain);
            gain.connect(window.audioCtx.destination);
            osc.frequency.value = noteFreqs[note];
            osc.type = 'sine';
            gain.gain.setValueAtTime(0.3, window.audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, window.audioCtx.currentTime + 0.5);
            osc.start();
            osc.stop(window.audioCtx.currentTime + 0.5);
            // 音頻節點使用後自動清理，防止記憶體洩漏
            setTimeout(() => { osc.disconnect(); gain.disconnect(); }, 600);
        }
        
        function switchTab(tab, btn) { document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active')); if (btn) btn.classList.add('active'); document.querySelectorAll('.tab-content').forEach(c => c.style.display = 'none'); getDomElement('tab' + tab.charAt(0).toUpperCase() + tab.slice(1)).style.display = 'block'; }
        
        function showHome() { 
            // 清理問答計時器，防止記憶體洩漏
            if (questionTimer) {
                clearInterval(questionTimer);
                questionTimer = null;
            }
            getDomElement('homePage').style.display = 'block'; 
            getDomElement('gameArea').classList.remove('active'); 
            getDomElement('backBtn').style.display = 'none'; 
            updateUI(); 
            clearDomCache(); 
        }
        
        function startGame(mode) { currentMode = mode; currentPracticeMode = null; gameScore = 0; gameCombo = 0; questionsAnswered = 0; correctThisRound = 0; perfectChecked = false; getDomElement('homePage').style.display = 'none'; getDomElement('gameArea').classList.add('active'); getDomElement('backBtn').style.display = 'block'; updateGameUI(); nextQuestion(); }
        
        function updateGameUI() { getDomElement('gameScore').textContent = gameScore; getDomElement('gameCombo').textContent = gameCombo; }
        
        function nextQuestion() { 
            getDomElement('gameContent').innerHTML = ''; 
            // 恢復所有選項按鈕的可用性
            document.querySelectorAll('.option-btn').forEach(btn => {
                btn.style.pointerEvents = 'auto';
                btn.style.opacity = '1';
            });
            switch(currentMode) { case 'ear': earTraining(); break; case 'note': noteRecognition(); break; case 'rhythm': rhythmTraining(); break; case 'chord': chordTraining(); break; case 'scale': scaleTraining(); break; case 'boss': bossBattle(); break; case 'weekly': weeklyQuest(); break; case 'practice': practiceMode(); break; } 
        }
        
        function earTraining() {
            const correct = notes[Math.floor(Math.random() * notes.length)];
            currentQuestion = correct;
            getDomElement('gameHint').textContent = '🎧 聽聲音，選音符';
            getDomElement('gameContent').innerHTML = '<div class="note-display" onclick="playNote(\'' + correct + '\')">🔊</div><div class="options-grid">' + notes.map((n, i) => '<button class="option-btn" onclick="checkAnswer(\'' + n + '\',\'' + correct + '\')" aria-label="選項 ' + (i+1) + ': ' + n + '">' + n + '</button>').join('') + '</div>';
            setTimeout(() => playNote(correct), 300);
        }
        
        function noteRecognition() {
            const note = notes[Math.floor(Math.random() * notes.length)];
            const mode = Math.random() > 0.5;
            currentQuestion = note;
            const correct = mode ? noteNames[note] : note;
            setTimeout(() => playNote(note), 100);
            getDomElement('gameHint').textContent = mode ? '這個音符的音名是？' : '這個音符的唱名是？';
            let opts = [correct]; const all = mode ? ['C','D','E','F','G','A','B'] : notes;
            while (opts.length < 4) { const o = all[Math.floor(Math.random() * all.length)]; if (!opts.includes(o)) opts.push(o); }
            opts = shuffleArray(opts);
            getDomElement('gameContent').innerHTML = '<div class="note-display">' + note + '</div><button onclick="playNote(\'' + note + '\')" style="font-size:1.5rem;background:rgba(255,255,255,0.2);border:none;border-radius:10px;padding:10px 20px;cursor:pointer;margin:10px;">🔊 再聽</button><div class="options-grid">' + opts.map((n, i) => '<button class="option-btn" onclick="checkAnswer(\'' + n + '\',\'' + correct + '\')" aria-label="選項 ' + (i+1) + ': ' + n + '">' + n + '</button>').join('') + '</div>';
        }
        
        // Fisher-Yates 洗牌算法
        function shuffleArray(array) {
            const arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }
        
        function rhythmTraining() {
            const rhythm = rhythms[Math.floor(Math.random() * rhythms.length)];
            currentQuestion = rhythm.name;
            getDomElement('gameHint').textContent = '這個音符有幾拍？';
            // 洗牌選項，讓使用者學習而不是記憶位置
            const beatOptions = shuffleArray([0.5, 1, 2, 4]);
            getDomElement('gameContent').innerHTML = '<div class="note-display">' + rhythm.symbol + '</div><div class="options-grid">' + beatOptions.map((n, i) => '<button class="option-btn" onclick="checkAnswer(' + n + ',' + rhythm.beats + ')" aria-label="選項 ' + (i+1) + ': ' + n + ' 拍">' + n + ' 拍</button>').join('') + '</div>';
        }
        
        function chordTraining() {
            const chord = chords[Math.floor(Math.random() * chords.length)];
            currentQuestion = chord.name;
            getDomElement('gameHint').textContent = '🎧 聽和弦，選名稱';
            // 洗牌和弦選項
            const shuffledChords = shuffleArray(chords);
            getDomElement('gameContent').innerHTML = '<button onclick="playChord(\'' + chord.notes.join(',') + '\')" style="font-size:3rem;background:linear-gradient(135deg,#9b59b6,#8e44ad);border:none;border-radius:50%;width:100px;height:100px;cursor:pointer;">🔊</button><div class="options-grid">' + shuffledChords.map((c, i) => '<button class="option-btn" onclick="checkAnswer(\'' + c.name + '\',\'' + chord.name + '\')" aria-label="選項 ' + (i+1) + ': ' + c.name + '">' + c.name + '</button>').join('') + '</div>';
            setTimeout(() => playChord(chord.notes), 300);
        }
        
        // 和弦同時播放（所有音符一起發聲）
        function playChord(notesStr) { 
            initAudio();
            if (!window.audioCtx) return;
            const notes = notesStr.split(',');
            const masterGain = window.audioCtx.createGain();
            masterGain.connect(window.audioCtx.destination);
            masterGain.gain.setValueAtTime(0.3, window.audioCtx.currentTime);
            masterGain.gain.exponentialRampToValueAtTime(0.01, window.audioCtx.currentTime + 1.0);
            
            notes.forEach(note => {
                if (!noteFreqs[note]) return;
                const osc = window.audioCtx.createOscillator();
                const gain = window.audioCtx.createGain();
                osc.connect(gain);
                gain.connect(masterGain);
                osc.frequency.value = noteFreqs[note];
                osc.type = 'sine';
                gain.gain.setValueAtTime(1, window.audioCtx.currentTime);
                osc.start();
                osc.stop(window.audioCtx.currentTime + 1.0);
            });
        }
        
        function scaleTraining() {
            const scale = scales[Math.floor(Math.random() * scales.length)];
            currentQuestion = scale.name;
            getDomElement('gameHint').textContent = '🎧 聽音階，選名稱';
            // 洗牌音階選項
            const shuffledScales = shuffleArray(scales);
            getDomElement('gameContent').innerHTML = '<button onclick="playScale(\'' + scale.notes.join(',') + '\')" style="font-size:3rem;background:linear-gradient(135deg,#4caf50,#8bc34a);border:none;border-radius:50%;width:100px;height:100px;cursor:pointer;">🔊</button><div class="options-grid">' + shuffledScales.map((s, i) => '<button class="option-btn" onclick="checkAnswer(\'' + s.name + '\',\'' + scale.name + '\')" aria-label="選項 ' + (i+1) + ': ' + s.name + '">' + s.name + '</button>').join('') + '</div>';
            setTimeout(() => playScale(scale.notes), 300);
        }
        
        function playScale(notesStr) { notesStr.split(',').forEach((n, i) => { setTimeout(() => playNote(n), i * 300); }); }
        
        function bossBattle() {
            const bosses = [{ name: '節奏怪獸', q: () => { const r = rhythms[Math.floor(Math.random() * rhythms.length)]; currentQuestion = r.name; getDomElement('gameHint').textContent = '👑 BOSS挑戰！這是什麼音符？'; const beatOptions = shuffleArray([0.5,1,2,4]); return { display: '<div class="note-display">' + r.symbol + '</div>', options: beatOptions.map((n, i) => '<button class="option-btn" onclick="checkAnswer(' + n + ',' + r.beats + ')" aria-label="選項 ' + (i+1) + ': ' + n + ' 拍">' + n + ' 拍</button>').join('') }; } }];
            const boss = bosses[0]; const q = boss.q();

        }
        
        // 答案冷卻機制 - 防止重複點擊導致分數計算錯誤
        let isProcessingAnswer = false;
        
        function checkAnswer(answer, correct) {
            // 如果正在處理答案，直接忽略重複點擊
            if (isProcessingAnswer) return;
            isProcessingAnswer = true;
            
            // 禁用所有選項按鈕
            document.querySelectorAll('.option-btn').forEach(btn => {
                btn.style.pointerEvents = 'none';
                btn.style.opacity = '0.7';
            });
            
            questionsAnswered++; playerData.totalPlayed++;
            const isCorrect = String(answer) === String(correct);
            if (isCorrect) { gameScore += 10 + gameCombo * 2; gameCombo++; correctThisRound++; if (correctThisRound === 1) perfectChecked = false; playerData.coins += 5; playerData.xp += 3; playSound('correct'); showFeedback('✅', '#4caf50'); if (gameCombo >= 5) { playSound('coin'); showFeedback('🔥 ' + gameCombo + ' COMBO!', '#ffd700'); } }
            else { gameCombo = 0; correctThisRound = 0; perfectChecked = false; playSound('wrong'); showFeedback('❌', '#f44336'); }
            updateGameUI(); checkQuests(); saveData();
            // 延遲後重置冷卻狀態並載入下一題
            setTimeout(() => {
                isProcessingAnswer = false;
                nextQuestion();
            }, 800);
        }
        
        function showFeedback(text, color) { const el = document.createElement('div'); el.className = 'feedback-popup'; el.textContent = text; el.style.color = color; document.body.appendChild(el); setTimeout(() => el.remove(), 600); }
        
        // 鍵盤支持 - 按數字鍵 1-4 或方向鍵選擇答案
        let selectedOptionIndex = 0;
        document.addEventListener('keydown', function(e) {
            // H 鍵顯示幫助說明
            if (e.key.toLowerCase() === 'h') {
                e.preventDefault();
                showHelpDialog();
                return;
            }
            if (!getDomElement('gameArea').classList.contains('active')) return;
            const buttons = document.querySelectorAll('.option-btn');
            if (buttons.length === 0) return;
            
            // 數字鍵 1-4 選擇
            if (e.key >= '1' && e.key <= '4') {
                const idx = parseInt(e.key) - 1;
                if (buttons[idx]) buttons[idx].click();
                return;
            }
            // 方向鍵導航
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                selectedOptionIndex = (selectedOptionIndex + 1) % buttons.length;
                buttons[selectedOptionIndex].focus();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                selectedOptionIndex = (selectedOptionIndex - 1 + buttons.length) % buttons.length;
                buttons[selectedOptionIndex].focus();
            } else if (e.key === 'Enter' || e.key === ' ') {
                if (document.activeElement.classList.contains('option-btn')) {
                    document.activeElement.click();
                }
            }
        });
        
        // 每次生成新問題時重置選項索引
        const originalNextQuestion = nextQuestion;
        nextQuestion = function() {
            selectedOptionIndex = 0;
            originalNextQuestion();
            // 自動聚焦第一個選項
            setTimeout(() => {
                const btn = document.querySelector('.option-btn');
                if (btn) btn.focus();
            }, 100);
        };
        
        updateUI();
    </script>

<script>
// ========== 更多優化功能 ==========

// 播放音效
function playSound(type) {
    initAudio();
    if (!window.audioCtx) return;
    const osc = window.audioCtx.createOscillator();
    const gain = window.audioCtx.createGain();
    osc.connect(gain);
    gain.connect(window.audioCtx.destination);
    
    if (type === 'correct') {
        osc.frequency.value = 880;
        osc.type = 'sine';
        gain.gain.setValueAtTime(0.2, window.audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, window.audioCtx.currentTime + 0.1);
        osc.start();
        osc.stop(window.audioCtx.currentTime + 0.1);
    } else if (type === 'wrong') {
        osc.frequency.value = 200;
        osc.type = 'sawtooth';
        gain.gain.setValueAtTime(0.2, window.audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, window.audioCtx.currentTime + 0.3);
        osc.start();
        osc.stop(window.audioCtx.currentTime + 0.3);
    } else if (type === 'levelup') {
        osc.frequency.value = 523.25;
        osc.type = 'square';
        gain.gain.setValueAtTime(0.15, window.audioCtx.currentTime);
        osc.start();
        osc.frequency.setValueAtTime(659.25, window.audioCtx.currentTime + 0.1);
        osc.frequency.setValueAtTime(783.99, window.audioCtx.currentTime + 0.2);
        gain.gain.exponentialRampToValueAtTime(0.01, window.audioCtx.currentTime + 0.4);
        osc.stop(window.audioCtx.currentTime + 0.4);
    } else if (type === 'coin') {
        osc.frequency.value = 1200;
        osc.type = 'sine';
        gain.gain.setValueAtTime(0.1, window.audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, window.audioCtx.currentTime + 0.05);
        osc.start();
        osc.stop(window.audioCtx.currentTime + 0.05);
    }
}

            <div style="display:flex;justify-content:center;position:relative;height:150px;">
                ${['Do','Re','Mi','Fa','Sol','La','Si'].map((n,i) => `<div class="piano-key" role="button" tabindex="0" aria-label="鋼琴鍵 ${n}" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();playNote('${n}');}" onclick="playNote('${n}')" style="width:45px;height:150px;background:white;border-radius:0 0 5px 5px;margin:0 2px;cursor:pointer;display:flex;align-items:flex-end;justify-content:center;padding-bottom:10px;color:#333;font-weight:bold;user-select:none;position:relative;z-index:2;">${n}</div>`).join('')}
                ${blackKeyPositions.map(bk => `<div role="button" tabindex="0" aria-label="鋼琴鍵 ${bk.note}" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();playNote('${bk.note}');}" onclick="playNote('${bk.note}')" style="width:30px;height:90px;background:#333;border-radius:0 0 3px 3px;position:absolute;left:${bk.left};top:20px;z-index:3;cursor:pointer;color:white;font-size:0.7rem;display:flex;align-items:flex-end;justify-content:center;padding-bottom:5px;box-shadow:2px 2px 5px rgba(0,0,0,0.5);">${bk.note}</div>`).join('')}
            </div>
            <div style="text-align:center;margin-top:20px;color:#888;font-size:0.9rem;">🎵 ${t('freePlayDesc')}</div>
        </div>
    `;
    document.body.insertAdjacentHTML('beforeend', pianoHTML);
}

// 在首頁添加鋼琴按鈕
const freePlayCard = '<button class="mode-card" type="button" id="freePlayCard" onclick="showPiano()"><div class="icon">🎹</div><div class="name" id="freePlayName">自由彈奏</div><div class="desc" id="freePlayDesc">隨意彈鋼琴</div></button>';

function createConfetti() {

    const confetti = document.createElement('div');
    confetti.style.cssText = `position:fixed;top:-20px;left:${Math.random() * 100}vw;width:10px;height:10px;background:${colors[Math.floor(Math.random() * colors.length)]};animation:confettiFall ${2 + Math.random()}s forwards;z-index:2999;`;

const confettiStyle = document.createElement('style');
confettiStyle.textContent = '@keyframes confettiFall { 0% { transform: translateY(0) rotate(0deg); opacity:1; } 100% { transform: translateY(100vh) rotate(720deg); opacity:0; } } @keyframes levelUpPop { 0% { transform:translate(-50%,-50%) scale(0); } 50% { transform:translate(-50%,-50%) scale(1.2); } 100% { transform:translate(-50%,-50%) scale(1); opacity:0; } }';
document.head.appendChild(confettiStyle);

// 修改答題音效
const originalCheckAnswer = checkAnswer;
checkAnswer = function(answer, correct) {
    const isCorrect = String(answer) === String(correct);
    playSound(isCorrect ? 'correct' : 'wrong');
    
    // 檢查升級
    const oldLevel = playerData.level;
    originalCheckAnswer(answer, correct);
    const { level } = calcLevel(playerData.xp);
    if (level > oldLevel) {
        setTimeout(() => showLevelUp(level), 1000);
    }
};

// 添加 CSS
const extraStyle = document.createElement('style');
extraStyle.textContent = '.piano-key:active { background: #ddd !important; transform: scale(0.98); } .piano-key:focus { outline: 3px solid #ffd700; outline-offset: -3px; }';

<script>
// 練習模式 - 無壓力
function practiceMode() {
    getDomElement('gameHint').textContent = '🎯 練習模式 - 選一個項目';
    getDomElement('gameContent').innerHTML = `
        <div class="mode-grid" style="margin-top:20px;">
            <button class="mode-card" type="button" onclick="practiceEar()"><div class="icon">👂</div><div class="name">聽力練習</div></button>
            <button class="mode-card" type="button" onclick="practiceNote()"><div class="icon">🎵</div><div class="name">音符練習</div></button>
            <button class="mode-card" type="button" onclick="practiceRhythm()"><div class="icon">🥁</div><div class="name">節奏練習</div></button>
            <button class="mode-card" type="button" onclick="practiceChord()"><div class="icon">🎹</div><div class="name">和弦練習</div></button>
        </div>
    `;
}

function practiceEar() {
    currentPracticeMode = 'ear';
    const correct = notes[Math.floor(Math.random() * notes.length)];
    playNote(correct);
    getDomElement('gameHint').textContent = '👂 這是什麼音符？';
    // 洗牌選項，讓使用者學習而不是記憶位置
    const shuffledNotes = shuffleArray([...notes]);
    getDomElement('gameContent').innerHTML = '<button onclick="practiceEar()" style="font-size:2rem;background:rgba(255,255,255,0.2);border:none;border-radius:50%;width:80px;height:80px;cursor:pointer;margin:20px;">🔊</button><div class="options-grid">' + shuffledNotes.map(n => '<button class="option-btn" onclick="practiceAnswer(this,\'' + n + '\',\'' + correct + '\')">' + n + '</button>').join('') + '</div>';
    // 自動聚焦第一個選項
    setTimeout(() => { const btn = document.querySelector('#gameContent .option-btn'); if (btn) btn.focus(); }, 100);
}

function practiceNote() {
    currentPracticeMode = 'note';
    const note = notes[Math.floor(Math.random() * notes.length)];
    const mode = Math.random() > 0.5;
    const correct = mode ? noteNames[note] : note;
    getDomElement('gameHint').textContent = mode ? '這個音符的音名是？' : '這個音符的唱名是？';
    // 洗牌選項
    const noteOptions = mode ? ['C','D','E','F','G','A','B'] : [...notes];
    const shuffledOptions = shuffleArray(noteOptions);
    getDomElement('gameContent').innerHTML = '<div class="note-display" style="font-size:5rem;">' + note + '</div><div class="options-grid">' + shuffledOptions.map(n => '<button class="option-btn" onclick="practiceAnswer(this,\'' + n + '\',\'' + correct + '\')">' + n + '</button>').join('') + '</div>';
    // 自動聚焦第一個選項
    setTimeout(() => { const btn = document.querySelector('#gameContent .option-btn'); if (btn) btn.focus(); }, 100);
}

function practiceRhythm() {
    currentPracticeMode = 'rhythm';
    const rhythm = rhythms[Math.floor(Math.random() * rhythms.length)];
    getDomElement('gameHint').textContent = '這個音符有幾拍？';
    // 洗牌選項
    const beatOptions = shuffleArray([0.5, 1, 2, 4]);
    getDomElement('gameContent').innerHTML = '<div class="note-display" style="font-size:5rem;">' + rhythm.symbol + '</div><div class="options-grid">' + beatOptions.map(n => '<button class="option-btn" onclick="practiceAnswer(this,' + n + ',' + rhythm.beats + ')">' + n + ' 拍</button>').join('') + '</div>';
    // 自動聚焦第一個選項
    setTimeout(() => { const btn = document.querySelector('#gameContent .option-btn'); if (btn) btn.focus(); }, 100);
}

function practiceChord() {
    currentPracticeMode = 'chord';
    const chord = chords[Math.floor(Math.random() * chords.length)];
    playChord(chord.notes);
    getDomElement('gameHint').textContent = '這是什麼和弦？';
    // 洗牌和弦選項
    const shuffledChords = shuffleArray([...chords]);
    getDomElement('gameContent').innerHTML = '<button onclick="practiceChord()" style="font-size:2rem;background:rgba(155,89,182,0.3);border:none;border-radius:50%;width:80px;height:80px;cursor:pointer;margin:20px;">🔊</button><div class="options-grid">' + shuffledChords.map(c => '<button class="option-btn" onclick="practiceAnswer(this,\'' + c.name + '\',\'' + chord.name + '\')">' + c.name + '</button>').join('') + '</div>';
    // 自動聚焦第一個選項
    setTimeout(() => { const btn = document.querySelector('#gameContent .option-btn'); if (btn) btn.focus(); }, 100);
}

// 週挑戰
function weeklyChallenge() {
    const weekNum = getWeekNumber();
    const saved = parseInt(localStorage.getItem('weeklyChallenge') || '0');
    
    if (saved >= weekNum) {
        getDomElement('gameHint').textContent = '📊 本週挑戰已完成！';
        getDomElement('gameContent').innerHTML = '<div style="text-align:center;margin:30px;"><div style="font-size:4rem;">✅</div><div style="font-size:1.5rem;margin:20px;">挑戰完成！</div><button onclick="weeklyChallenge()" style="padding:15px 30px;background:linear-gradient(135deg,#ffd700,#ff8c00);border:none;border-radius:10px;font-size:1.2rem;cursor:pointer;">再玩一次</button></div>';
    } else {
        // 開始挑戰 - 20題限時
        gameScore = 0; gameCombo = 0; questionsAnswered = 0; correctThisRound = 0; perfectChecked = false;
        getDomElement('gameHint').textContent = '📊 週挑戰！目標：20題全對！';
        weeklyQuest();
    }
}

function getWeekNumber() {
    const now = new Date();
    const start = new Date(now.getFullYear(), 0, 1);
    return Math.ceil(((now - start) / 86400000 + start.getDay() + 1) / 7);
}

function weeklyQuest() {
    if (questionsAnswered >= 20) {
        // 挑戰完成
        const weekNum = getWeekNumber();
        try { localStorage.setItem('weeklyChallenge', weekNum); } catch(e) { console.warn('儲存週挑戰失敗:', e); }
        const reward = 200 + gameScore;
        playerData.coins += reward;
        playerData.xp += 100;
        saveData();
        
        getDomElement('gameHint').textContent = '🎉 週挑戰完成！';
        getDomElement('gameContent').innerHTML = '<div style="text-align:center;margin:30px;"><div style="font-size:4rem;">🏆</div><div style="font-size:1.5rem;margin:20px;">獲得 ' + reward + ' 金幣！</div></div>';
        
        for (let i = 0; i < 50; i++) setTimeout(() => createConfetti(), i * 30);
        return;
    }
    
    // 隨機題目
    const rand = Math.random();
    if (rand < 0.25) earTraining();
    else if (rand < 0.5) noteRecognition();
    else if (rand < 0.75) rhythmTraining();
    else chordTraining();
    
    questionsAnswered++;
    getDomElement('gameHint').textContent = '📊 週挑戰 ' + questionsAnswered + '/20 - 目標全對！';
}

// 覆蓋 startGame
const originalStartGame = startGame;
startGame = function(mode) {
    if (mode === 'practice') {
        currentMode = 'practice';
        getDomElement('homePage').style.display = 'none';
        getDomElement('gameArea').classList.add('active');
        getDomElement('backBtn').style.display = 'block';
        practiceMode();
    } else if (mode === 'weekly') {
        currentMode = 'weekly';
        getDomElement('homePage').style.display = 'none';
        getDomElement('gameArea').classList.add('active');
        getDomElement('backBtn').style.display = 'block';
        weeklyChallenge();
    } else {
        originalStartGame(mode);
    }
};
</script>

<script>
// ========== 更多優化 ==========

// 設置面板

let soundOn = true, bgmOn = false, vibrateOn = true;

function toggleSound(val) { soundOn = val; try { localStorage.setItem('soundOn', val); } catch(e) { console.warn('儲存設定失敗:', e); } }
function toggleBGM(val) { bgmOn = val; try { localStorage.setItem('bgmOn', val); } catch(e) { console.warn('儲存設定失敗:', e); } }
function toggleVibrate(val) { vibrateOn = val; try { localStorage.setItem('vibrateOn', val); } catch(e) { console.warn('儲存設定失敗:', e); } }
function adjustBrightness(val) { document.body.style.filter = 'brightness(' + (val/100) + ')'; }

function resetProgress() {
    if (confirm('確定要重置所有進度嗎？這無法復原！')) {
        localStorage.clear();
        location.reload();
    }
}

// 載入設置
function loadSettings() {
    if (!storageAvailable) return;
    try {
        soundOn = localStorage.getItem('soundOn') !== 'false';
        bgmOn = localStorage.getItem('bgmOn') === 'true';
        vibrateOn = localStorage.getItem('vibrateOn') !== 'false';
    } catch(e) {
        console.warn('載入設定失敗:', e);
    }
}

document.querySelector('.tab-buttons').insertAdjacentHTML('beforeend', '<button class="tab-btn" onclick="showSettings()">⚙️</button>');

// 震動反饋
function vibrate(pattern) {
    if (vibrateOn && navigator.vibrate) {
        navigator.vibrate(pattern);
    }
}

// 增強音效
const originalPlaySound = playSound;
playSound = function(type) {
    if (!soundOn) return;
    originalPlaySound(type);
    vibrate(type === 'correct' ? 50 : type === 'wrong' ? 100 : 30);
};

// 分享功能
function shareGame() {
    const shareData = {
        title: '🎹 音樂達人',
        text: '我在音樂達人已經達到 ' + playerData.level + ' 級！來挑戰吧！',
        url: 'https://j87916028-cyber.github.io/music-theory-game/'
    };
    
    if (navigator.share) {
        navigator.share(shareData);
    } else {
        // 複製連結
        navigator.clipboard.writeText(shareData.url).then(() => {
            const m = document.createElement('div');

    setTimeout(() => {
        switch(currentPracticeMode) {
            case 'ear': practiceEar(); break;

            case 'rhythm': practiceRhythm(); break;
            case 'chord': practiceChord(); break;
            default: practiceEar(); // 預設為聽力練習
        }

    if (isCorrect) {

    const hint = getDomElement('gameHint');

    const text = hint.textContent;
    if (text.includes('聽聲音')) hint.textContent = t('listen');
    else if (text.includes('音名')) hint.textContent = t('noteName');
    else if (text.includes('唱名')) hint.textContent = t('solfege');
    else if (text.includes('幾拍')) hint.textContent = t('beats');
    else if (text.includes('聽和弦')) hint.textContent = t('chordName');

function checkDailyLogin() {
    const today = new Date().toISOString().split('T')[0];
    const lastLogin = playerData.lastLogin;
    const dailyText = document.getElementById('dailyText');
    
    if (!dailyText) return;
    
    if (lastLogin !== today) {
        if (lastLogin) {
            try {
                const diff = (new Date(today) - new Date(lastLogin)) / (1000 * 60 * 60 * 24);
                if (diff > 1) playerData.dayStreak = 0;
            } catch(e) {}
        }
        dailyText.textContent = t('claim');

function switchInstrument(inst) {
    currentInstrument = inst;
    try { localStorage.setItem('pianoInstrument', inst); } catch(e) { console.warn('儲存樂器設定失敗:', e); }
    showAdvancedPiano();
}

function playPianoNote(note) {
    initAudio();
    const inst = instruments2[currentInstrument];
    const osc = window.audioCtx.createOscillator();
    const gain = window.audioCtx.createGain();
    
    osc.connect(gain);
    gain.connect(window.audioCtx.destination);
    
    // 根據音符計算頻率
    const baseFreq = noteFreqs[note] || 261.63;
    osc.frequency.value = baseFreq;
    osc.type = inst.wave;
    
    gain.gain.setValueAtTime(0.3, window.audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, window.audioCtx.currentTime + 0.8);
    
    osc.start();
    osc.stop(window.audioCtx.currentTime + 0.8);
    
    // 錄音中
    if (isRecording && recordingNotes.length < 100) {
        recordingNotes.push({ note: note, time: Date.now() });
    }
}

// 錄音系統
let isRecording = false;
let recordingNotes = [];

function startRecording() {
    isRecording = true;
    recordingNotes = [];
    document.getElementById('recBtn').style.display = 'none';
    document.getElementById('stopBtn').style.display = 'inline-block';
    document.getElementById('playBtn').style.display = 'none';
    document.getElementById('recStatus').textContent = '🔴 錄音中...';
}

function stopRecording() {
    isRecording = false;
    document.getElementById('recBtn').style.display = 'inline-block';
    document.getElementById('stopBtn').style.display = 'none';
    document.getElementById('playBtn').style.display = 'inline-block';
    document.getElementById('recStatus').textContent = `✅ 錄製完成！${recordingNotes.length} 個音符`;
}

function playRecording() {
    if (recordingNotes.length === 0) return;
    
    const startTime = recordingNotes[0].time;
    recordingNotes.forEach((n, i) => {
        setTimeout(() => {
            playPianoNote(n.note);
        }, n.time - startTime);
    });
}

function clearRecording() {
    recordingNotes = [];
    document.getElementById('playBtn').style.display = 'none';
    document.getElementById('recStatus').textContent = '已清除';
}

document.querySelector('.mode-grid').innerHTML = document.querySelector('.mode-grid').innerHTML.replace('onclick="showPiano()"', 'onclick="showAdvancedPiano()"');

<script>
// ========== 節奏遊戲 ==========

// 節奏遊戲變數（移到全域作用域以修復 bug）
let rhythmScore = 0;
let rhythmRunning = false;
let bpm = 60;
let beatInterval = null;
let lastBeatTime = 0;
let perfectCount = 0;

function showRhythmGame() {
    // 重置遊戲狀態
    rhythmRunning = false;
    rhythmScore = 0;
    perfectCount = 0;
    if (beatInterval) {
        clearInterval(beatInterval);
        beatInterval = null;
    }
    
    const rhythmGameHTML = `
        <div id="rhythmGame" style="position:fixed;top:0;left:0;right:0;bottom:0;background:linear-gradient(180deg,#0d0d1a,#1a1a2e);z-index:3000;">
            <div style="padding:20px;text-align:center;">
                <div style="display:flex;justify-content:space-between;align-items:center;">
                    <button onclick="closeRhythmGame()" style="background:none;border:none;color:white;font-size:1.5rem;cursor:pointer;">✕</button>
                    <h2 style="color:#ffd700;">🥁 節奏遊戲</h2>
                    <div></div>
                </div>
                
                <div style="margin:20px 0;">
                    <div style="font-size:3rem;margin-bottom:20px;">🎵</div>
                    <div id="rhythmScore" style="font-size:2rem;color:#ffd700;">0</div>
                    <div style="color:#888;">分數</div>
                </div>
                
                <div id="rhythmArea" style="height:300px;position:relative;background:rgba(255,255,255,0.1);border-radius:20px;margin:20px 0;overflow:hidden;">
                    <div id="beatLine" style="position:absolute;bottom:50px;left:0;right:0;height:5px;background:linear-gradient(90deg,transparent,#00bfff,transparent);"></div>
                </div>
                
                <div style="display:flex;gap:20px;justify-content:center;">
                    <button id="tapBtn" ontouchstart="tapBeat(event)" onmousedown="tapBeat(event)" style="width:120px;height:120px;border-radius:50%;background:linear-gradient(135deg,#e94560,#ff6b6b);border:none;color:white;font-size:1.5rem;font-weight:bold;cursor:pointer;box-shadow:0 5px 30px rgba(233,69,96,0.5);">TAP!</button>
                </div>
                
                <div style="margin-top:20px;color:#888;">
                    節奏：<span id="bpmDisplay">60</span> BPM
                </div>
                
                <button onclick="startRhythmGame()" id="startRhythmBtn" style="margin-top:20px;padding:15px 40px;background:linear-gradient(135deg,#4caf50,#8bc34a);border:none;border-radius:30px;color:white;font-size:1.2rem;cursor:pointer;">▶️ 開始</button>
            </div>
        </div>
    `;
    document.body.insertAdjacentHTML('beforeend', rhythmGameHTML);
}

function startRhythmGame() {
    rhythmScore = 0;
    perfectCount = 0;
    rhythmRunning = true;
    document.getElementById('rhythmScore').textContent = '0';
    document.getElementById('startRhythmBtn').style.display = 'none';
    
    // 開始節拍
    beatInterval = setInterval(() => {
        spawnBeat();
    }, 60000 / bpm);
}

function spawnBeat() {
    const area = document.getElementById('rhythmArea');
    const beat = document.createElement('div');
    beat.style.cssText = 'position:absolute;width:60px;height:60px;background:linear-gradient(135deg,#00bfff,#0099cc);border-radius:50%;left:50%;bottom:50px;transform:translateX(-50%);animation:beatFall 1.5s linear forwards;';
    beat.id = 'activeBeat';
    area.appendChild(beat);
    
    setTimeout(() => {
        if (beat.parentNode) {
            beat.remove();
            // 錯過
            perfectCount = 0;
        }
    }, 1500);
}

function tapBeat(e) {
    if (!rhythmRunning) return;
    e.preventDefault();
    
    const now = Date.now();
    const beat = document.getElementById('activeBeat');
    
    if (beat) {
        const rect = beat.getBoundingClientRect();
        const lineY = document.getElementById('rhythmArea').getBoundingClientRect().bottom - 50;
        const diff = Math.abs(rect.bottom - lineY);
        
        if (diff < 30) {
            // Perfect!
            rhythmScore += 100;
            perfectCount++;
            showRhythmFeedback('PERFECT!', '#4caf50');
            beat.remove();
        } else if (diff < 60) {
            // Good
            rhythmScore += 50;
            perfectCount++;
            showRhythmFeedback('GOOD', '#ffd700');
            beat.remove();
        } else {
            // Miss
            perfectCount = 0;
            showRhythmFeedback('MISS', '#f44336');
        }
    } else {
        // 提前按
        if (now - lastBeatTime < 300) {
            rhythmScore -= 10;
            showRhythmFeedback('TOO EARLY', '#f44336');
        }
    }
    
    lastBeatTime = now;
    document.getElementById('rhythmScore').textContent = rhythmScore;
    
    // 連擊加成
    if (perfectCount > 5) {
        rhythmScore += 10;
    }
}

function showRhythmFeedback(text, color) {
    const area = document.getElementById('rhythmArea');
    const feedback = document.createElement('div');
    feedback.style.cssText = 'position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:2rem;font-weight:bold;color:' + color + ';animation:feedbackPop 0.5s forwards;z-index:10;';
    feedback.textContent = text;
    area.appendChild(feedback);
    
    setTimeout(() => feedback.remove(), 500);
}

function closeRhythmGame() {
    rhythmRunning = false;
    clearInterval(beatInterval);
    document.getElementById('rhythmGame').remove();
}

// 添加 CSS
const rhythmCSS = document.createElement('style');
rhythmCSS.textContent = '@keyframes beatFall { 0% { bottom: 300px; opacity: 0; } 20% { opacity: 1; } 100% { bottom: 50px; opacity: 1; } } @keyframes feedbackPop { 0% { transform:translate(-50%,-50%) scale(0); } 50% { transform:translate(-50%,-50%) scale(1.2); } 100% { transform:translate(-50%,-50%) scale(1); opacity: 0; } }';
document.head.appendChild(rhythmCSS);

// 添加按鈕
document.querySelector('.mode-grid').innerHTML += '<button class="mode-card" type="button" onclick="showRhythmGame()"><div class="icon">🥁</div><div class="name">節奏遊戲</div><div class="desc">敲擊節拍！</div></button>';
</script>

            </div>
        </div>
    `;
    document.body.insertAdjacentHTML('beforeend', html);
}

function updateDailyChallengeProgress(mode, amount) {
    const today = new Date().toISOString().split('T')[0];
    const data = loadDailyChallenges();
    
    let allComplete = true;
    let totalReward = 0;
    
    data.challenges.forEach(c => {
        if (!c.completed) {
            if ((c.mode === mode || c.mode === 'score') && c.progress < c.target) {
                c.progress += amount;
                if (c.progress >= c.target) {
                    c.completed = true;
                    totalReward += c.reward;
                }
            }
            if (!c.completed) allComplete = false;
        }
    });
    
    // 全部完成額外獎勵
    if (allComplete && !data.allComplete) {
        totalReward += 100;
        data.allComplete = true;
    }
    
    if (totalReward > 0) {
        playerData.coins += totalReward;
        saveData();
        showFeedback('+' + totalReward + '💰 每日挑戰！', '#ffd700');
    }
    
    localStorage.setItem('dailyChallenges_' + today, JSON.stringify(data));
}

// 監控答題進度
const oldCheckAnswer = checkAnswer;
checkAnswer = function(answer, correct) {
    oldCheckAnswer(answer, correct);
    
    if (correct && (currentMode === 'ear' || currentMode === 'note' || currentMode === 'rhythm' || currentMode === 'chord')) {
        updateDailyChallengeProgress(currentMode, 1);
    }
    
    if (gameScore >= 500) {
        updateDailyChallengeProgress('score', gameScore);
    }
};

// 監控鋼琴
const oldPlayPianoNote = playPianoNote;
playPianoNote = function(note) {
    oldPlayPianoNote(note);
    updateDailyChallengeProgress('piano', 1);
};

document.querySelector('.tab-buttons').insertAdjacentHTML('beforeend', '<button class="tab-btn" onclick="showDailyChallenges()">📅</button>');

<script>
// ========== 練習連勝系統 ==========

function updatePracticeStreak() {
    const today = new Date().toISOString().split('T')[0];
    const lastPractice = localStorage.getItem('lastPracticeDate');
    const streak = parseInt(localStorage.getItem('practiceStreak') || '0');
    
    if (lastPractice !== today) {
        const yesterday = new Date();
        yesterday.setDate(yesterday.getDate() - 1);
        const yesterdayStr = yesterday.toISOString().split('T')[0];
        
        let newStreak;
        if (lastPractice === yesterdayStr) {
            newStreak = streak + 1;
        } else {
            newStreak = 1;
        }
        
        try {
            localStorage.setItem('practiceStreak', newStreak);
            localStorage.setItem('lastPracticeDate', today);
        } catch(e) { console.warn('儲存練習連勝失敗:', e); }
        
        // 顯示連勝獎勵
        if (newStreak > 1) {
            const streakBonus = newStreak * 10;
            playerData.coins += streakBonus;
            playerData.xp += newStreak * 5;
            saveData();
            
            setTimeout(() => {
                showStreakPopup(newStreak, streakBonus);
            }, 1000);

}

<script>
// ========== 記憶力訓練 ==========

function showMemoryGame() {
    const notes4 = ['Do', 'Re', 'Mi', 'Fa', 'Sol', 'La'];
    const cards = shuffleArray([...notes4, ...notes4]);
    
    const memoryHTML = `
        <div id="memoryPanel" style="position:fixed;top:0;left:0;right:0;bottom:0;background:linear-gradient(135deg,#1a1a2e,#0d0d1a);z-index:3500;overflow-y:auto;">
            <div style="padding:20px;max-width:400px;margin:0 auto;">
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
                    <h2 style="color:#ffd700;">🧠 記憶力訓練</h2>
                    <button onclick="document.getElementById('memoryPanel').remove()" style="background:none;border:none;color:white;font-size:1.5rem;cursor:pointer;">✕</button>
                </div>
                
                <div style="text-align:center;margin-bottom:15px;">
                    <span style="color:#ffd700;font-size:1.2rem;">${0}</span> 回合
                </div>
                
                <div id="memoryGrid" style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;">
                    ${cards.map((note, i) => `
                        <div class="memory-card" onclick="flipCard(this,'${note}',${i})" style="height:80px;background:linear-gradient(135deg,#e94560,#ff6b6b);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:2rem;cursor:pointer;transform:scale(1);transition:transform 0.3s;">
                            ❓
                        </div>
                    `).join('')}
                </div>
                
                <div style="text-align:center;margin-top:20px;color:#888;">
                    翻出相同的音符！
                </div>
            </div>
        </div>
    `;
    document.body.insertAdjacentHTML('beforeend', memoryHTML);
}

let flippedCards = [];
let matchedPairs = 0;
let moves = 0;

function flipCard(el, note, index) {
    if (el.classList.contains('flipped') || flippedCards.length >= 2) return;
    
    el.classList.add('flipped');
    el.style.background = 'linear-gradient(135deg,#4caf50,#8bc34a)';
    el.textContent = note;
    el.dataset.note = note;
    
    flippedCards.push({ el, note, index });
    
    if (flippedCards.length === 2) {
        moves++;
        document.querySelector('#memoryPanel span').textContent = moves;
        
        const [card1, card2] = flippedCards;
        
        if (card1.note === card2.note) {
            // 配對成功
            matchedPairs++;
            card1.el.style.opacity = '0.5';
            card2.el.style.opacity = '0.5';
            card1.el.style.cursor = 'default';
            card2.el.style.cursor = 'default';
            flippedCards = [];
            
            playSound('correct');
            
            if (matchedPairs === 6) {
                setTimeout(() => {
                    const reward = 50 - moves * 2;
                    playerData.coins += Math.max(10, reward);
                    playerData.xp += 20;
                    saveData();
                    
                    showFeedback(`🎉 完成！+${Math.max(10, reward)}💰`, '#ffd700');
                }, 500);
            }
        } else {
            // 配對失敗
            setTimeout(() => {
                card1.el.classList.remove('flipped');
                card2.el.classList.remove('flipped');
                card1.el.style.background = 'linear-gradient(135deg,#e94560,#ff6b6b)';
                card2.el.style.background = 'linear-gradient(135deg,#e94560,#ff6b6b)';
                card1.el.textContent = '❓';
                card2.el.textContent = '❓';
                flippedCards = [];
            }, 800);
            playSound('wrong');
        }
    }
}

// 添加按鈕
document.querySelector('.mode-grid').innerHTML += '<button class="mode-card" type="button" onclick="showMemoryGame()"><div class="icon">🧠</div><div class="name">記憶訓練</div><div class="desc">翻牌配對練習</div></button>';
</script>

<script>
// ========== 音效系統增強 ==========

// 更豐富的音效
function playEnhancedSound(type) {
    if (!soundOn) return;
    
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    
    switch(type) {
        case 'correct':
            osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5
            osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1); // E5
            osc.type = 'sine';
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.2);
            break;
            
        case 'wrong':
            osc.frequency.setValueAtTime(200, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.3);
            osc.type = 'sawtooth';
            gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.3);
            break;
            
        case 'coin':
            osc.frequency.setValueAtTime(1200, audioCtx.currentTime);
            osc.type = 'sine';
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.08);
            break;
            
        case 'levelup':
            const notes = [523.25, 659.25, 783.99, 1046.50];
            notes.forEach((freq, i) => {
                const o = audioCtx.createOscillator();
                const g = audioCtx.createGain();
                o.connect(g);
                g.connect(audioCtx.destination);
                o.frequency.value = freq;
                o.type = 'square';
                g.gain.setValueAtTime(0.1, audioCtx.currentTime + i * 0.1);
                g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + i * 0.1 + 0.15);
                o.start(audioCtx.currentTime + i * 0.1);
                o.stop(audioCtx.currentTime + i * 0.1 + 0.15);
            });
            return;
            
        case 'click':
            osc.frequency.value = 800;
            osc.type = 'sine';
            gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.05);
            break;
    }
    
    vibrate(type === 'correct' ? 30 : type === 'wrong' ? 80 : 20);
}

// 覆蓋原有函數
const oldPlaySound = playSound;
playSound = function(type) {
    if (soundOn) {
        playEnhancedSound(type);
    }
};

// 按鈕點擊音效
document.addEventListener('click', function(e) {
    if (e.target.tagName === 'BUTTON') {
        playEnhancedSound('click');
    }
}, { passive: true });
</script>

<script>

function showDailyRewardAnimation() {

    const now = Date.now();

// 重新定義 updateAllTexts 來更新所有硬編碼文字
updateAllTexts = function() {
    if (!getDomElement('langLabel')) return;
    
    getDomElement('langLabel').textContent = langNames[currentLang];
    
    // 標題
    if(document.querySelector('h1')) document.querySelector('h1').textContent = t('home');
    
    // 標籤按鈕
    const tabBtns = document.querySelectorAll('.tab-btn');
    if (tabBtns[0]) tabBtns[0].innerHTML = '🎮 ' + t('play');
    if (tabBtns[1]) tabBtns[1].innerHTML = '📋 ' + t('quest');
    if (tabBtns[2]) tabBtns[2].innerHTML = '🎨 ' + t('collection');
    if (tabBtns[3]) tabBtns[3].innerHTML = '🏆 ' + t('achievement');
    
    // 統計
    const statLabels = document.querySelectorAll('.stat-label');
    if (statLabels[0]) statLabels[0].textContent = t('level');
    if (statLabels[1]) statLabels[1].textContent = t('xp');
    if (statLabels[2]) statLabels[2].textContent = t('coins');
    if (statLabels[3]) statLabels[3].textContent = t('days');
    
    // 遊戲卡片
    const modeCards = document.querySelectorAll('.mode-card');
    const modeNames = [t('ear'), t('note'), t('rhythm'), t('chord'), t('scale')];
    modeCards.forEach((card, i) => {
        if (modeNames[i] && card.querySelector('.name')) {
            card.querySelector('.name').textContent = modeNames[i];
        }
    });
    
    // 每日登入
    const dailyText = document.getElementById('dailyText');
    if (dailyText) {
        const lastLogin = playerData.lastLogin;
        const today = new Date().toISOString().split('T')[0];
        if (lastLogin === today) {
            dailyText.textContent = t('claimed');
        } else {
            dailyText.textContent = t('claim');
        }
    }
};

// 初始化時調用

<script>
// ========== 轉盤抽獎系統 ==========

function showLuckyWheel() {
    const prizes = [
        { name: '50 金幣', value: 50, color: '#ffd700', icon: '💰' },
        { name: '100 金幣', value: 100, color: '#ff8c00', icon: '💰' },
        { name: '20 經驗', value: 20, color: '#4caf50', icon: '⭐' },
        { name: '謝謝參與', value: 0, color: '#888', icon: '😢' },
        { name: '50 金幣', value: 50, color: '#ffd700', icon: '💰' },
        { name: '200 金幣', value: 200, color: '#e94560', icon: '💎' }
    ];
    
    const wheelHTML = `
        <div id="wheelPanel" style="position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.95);z-index:5500;display:flex;flex-direction:column;align-items:center;justify-content:center;">
            <h2 style="color:#ffd700;margin-bottom:20px;">🎰 幸運轉盤</h2>
            
            <div id="wheel" style="width:280px;height:280px;border-radius:50%;background:conic-gradient(${prizes.map((p,i)=>p.color+' '+(i*60)+'deg '+(i*60+60)+'deg').join(',')});position:relative;border:10px solid #ffd700;box-shadow:0 0 30px rgba(255,215,0,0.5);">
                <div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:60px;height:60px;background:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.5rem;">🎯</div>
            </div>
            
            <button id="spinBtn" onclick="spinWheel()" style="margin-top:30px;padding:15px 50px;background:linear-gradient(135deg,#ffd700,#ff8c00);border:none;border-radius:30px;color:#000;font-size:1.2rem;font-weight:bold;cursor:pointer;">開始轉動！</button>
            
            <div style="margin-top:20px;color:#888;font-size:0.9rem;">每天可轉 1 次</div>
            
            <button onclick="document.getElementById('wheelPanel').remove()" style="margin-top:20px;background:none;border:none;color:#888;cursor:pointer;">關閉</button>
        </div>
    `;
    document.body.insertAdjacentHTML('beforeend', wheelHTML);
}

let isSpinning = false;

function spinWheel() {
    if (isSpinning) return;
    isSpinning = true;
    
    const wheel = document.getElementById('wheel');
    const btn = document.getElementById('spinBtn');
    btn.disabled = true;
    btn.textContent = '轉動中...';
    
    // 隨機旋轉角度
    const prizeIndex = Math.floor(Math.random() * 6);
    const rotation = 360 * 5 + prizeIndex * 60 + Math.random() * 30;
    
    wheel.style.transition = 'transform 4s cubic-bezier(0.17, 0.67, 0.12, 0.99)';
    wheel.style.transform = `rotate(${rotation}deg)`;
    
    setTimeout(() => {
        const prizes = ['50 金幣', '100 金幣', '20 經驗', '謝謝參與', '50 金幣', '200 金幣'];
        const prize = prizes[prizeIndex];
        
        if (prize.includes('金幣') && !prize.includes('謝謝')) {
            const value = parseInt(prize);
            playerData.coins += value;
            playerData.xp += 10;
            saveData();
            showFeedback(`+${value}💰`, '#ffd700');
        } else if (prize.includes('經驗')) {
            playerData.xp += 20;
            saveData();
            showFeedback('+20⭐', '#4caf50');
        }
        
        // 記錄今天已轉
        const today = new Date().toISOString().split('T')[0];
        localStorage.setItem('wheelPlayed', today);
        
        btn.textContent = '明天再來！';
        isSpinning = false;
    }, 4000);
}

// 檢查是否可以轉
function checkWheel() {
    const today = new Date().toISOString().split('T')[0];
    const lastPlayed = localStorage.getItem('wheelPlayed');
    return lastPlayed !== today;
}

// 添加到設置
const originalShowSettings6 = showSettings;
showSettings = function() {
    originalShowSettings6();
    setTimeout(() => {
        const panel = document.querySelector('#settingsPanel > div');
        if (panel && !document.getElementById('wheelBtn')) {
            const btn = document.createElement('button');
            btn.id = 'wheelBtn';
            btn.textContent = checkWheel() ? '🎰 幸運轉盤' : '🎰 已轉過';
            btn.onclick = function() {
                if (checkWheel()) {
                    document.getElementById('settingsPanel').remove();
                    showLuckyWheel();
                } else {
                    showFeedback('明天再來！', '#888');
                }
            };
            btn.style.cssText = 'width:100%;padding:15px;background:linear-gradient(135deg,#9c27b0,#e040fb);border:none;border-radius:10px;color:white;font-weight:bold;cursor:pointer;margin-top:15px;';
            panel.appendChild(btn);
        }
    }, 100);
};
</script>

                </div>
            </div>
        </div>
    `;
    document.body.insertAdjacentHTML('beforeend', html);
}

// 追蹤目標進度
function updateDailyGoal(type, value) {
    const today = new Date().toISOString().split('T')[0];
    const goal = JSON.parse(localStorage.getItem('dailyGoal_' + today) || '{"questions":0,"coins":0,"time":0}');
    
    if (type === 'question') goal.questions += value;
    if (type === 'coins') goal.coins += value;
    if (type === 'time') goal.time += value;
    
    localStorage.setItem('dailyGoal_' + today, JSON.stringify(goal));
    
    // 檢查是否全部完成
    const targets = { questions: 20, coins: 100 };
    if (goal.questions >= targets.questions && goal.coins >= targets.coins) {
        const alreadyRewarded = localStorage.getItem('goalRewarded_' + today);
        if (!alreadyRewarded) {
            playerData.coins += 100;
            playerData.xp += 50;
            saveData();
            localStorage.setItem('goalRewarded_' + today, 'true');
            showFeedback('🎉 目標完成！+100💰', '#ffd700');
        }
    }
}

// 添加按鈕
document.querySelector('.tab-buttons').insertAdjacentHTML('beforeend', '<button class="tab-btn" onclick="showDailyGoal()">🎯</button>');
</script>

<script>
// ========== 練習日曆 ==========

function showPracticeCalendar() {
    const today = new Date();
    const year = today.getFullYear();
    const month = today.getMonth();
    
    const firstDay = new Date(year, month, 1).getDay();
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    
    let calendarHTML = `
        <div id="calendarPanel" style="position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.95);z-index:4800;overflow-y:auto;">
            <div style="padding:20px;max-width:380px;margin:0 auto;">
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
                    <h2 style="color:#ffd700;">📆 練習日曆</h2>
                    <button onclick="document.getElementById('calendarPanel').remove()" style="background:none;border:none;color:white;font-size:1.5rem;cursor:pointer;">✕</button>
                </div>
                
                <div style="text-align:center;font-size:1.2rem;margin-bottom:15px;">${year}年 ${month + 1}月</div>
                
                <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center;margin-bottom:10px;">
                    <div style="color:#888;">日</div><div style="color:#888;">一</div><div style="color:#888;">二</div><div style="color:#888;">三</div><div style="color:#888;">四</div><div style="color:#888;">五</div><div style="color:#888;">六</div>
                </div>
                
                <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center;">
    `;
    
    // 填充空白
    for (let i = 0; i < firstDay; i++) {
        calendarHTML += '<div></div>';
    }
    
    // 日期
    for (let day = 1; day <= daysInMonth; day++) {
        const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        const practiced = localStorage.getItem('practiced_' + dateStr);
        const isToday = day === today.getDate();
        
        calendarHTML += `
            <div style="padding:10px;border-radius:10px;${isToday ? 'border:2px solid #ffd700;' : ''}${practiced ? 'background:linear-gradient(135deg,#4caf50,#8bc34a);' : 'background:rgba(255,255,255,0.1);'}">
                ${day}
                ${practiced ? '✅' : ''}
            </div>
        `;
    }
    
    calendarHTML += '</div></div></div>';
    document.body.insertAdjacentHTML('beforeend', calendarHTML);
}

// 記錄練習日期
function markPracticed() {
    const today = new Date().toISOString().split('T')[0];
    localStorage.setItem('practiced_' + today, 'true');
}

// 添加按鈕
document.querySelector('.tab-buttons').insertAdjacentHTML('beforeend', '<button class="tab-btn" onclick="showPracticeCalendar()">📆</button>');
</script>

                    <button onclick="document.getElementById('badgeWallPanel').remove()" style="background:none;border:none;color:white;font-size:1.5rem;cursor:pointer;">✕</button>
                </div>

        const isUnlocked = unlocked.includes(badge.id) || badgeCondition(badge.id);
        html += `
            <div style="background:${isUnlocked ? badge.color : 'rgba(255,255,255,0.1)'};padding:15px;border-radius:15px;text-align:center;${isUnlocked ? 'box-shadow:0 0 20px ' + badge.color + ';' : 'opacity:0.5;'}">

function badgeCondition(id) {
    const conditions = {
        'first': () => playerData.totalPlayed >= 1,
        'ten': () => playerData.totalPlayed >= 10,
        'hundred': () => playerData.totalPlayed >= 100,
        'streak3': () => parseInt(localStorage.getItem('musicMaxCombo') || '0') >= 3,
        'streak10': () => parseInt(localStorage.getItem('musicMaxCombo') || '0') >= 10,
        'rich100': () => playerData.coins >= 100,
        'rich500': () => playerData.coins >= 500,
        'level5': () => playerData.level >= 5,
        'level10': () => playerData.level >= 10,
        'daily3': () => playerData.dayStreak >= 3,
        'daily7': () => playerData.dayStreak >= 7,
        'piano': () => parseInt(localStorage.getItem('pianoPlays') || '0') >= 10
    };
    return conditions[id] ? conditions[id]() : false;
}
</script>

<script>
// ========== 里程碑系統 ==========

function checkMilestones() {
    const milestones = [
        { id: 'play_10', name: '初試身手', desc: '完成 10 題', target: 10, icon: '🎯', type: 'play' },
        { id: 'play_50', name: '小有成就', desc: '完成 50 題', target: 50, icon: '⭐', type: 'play' },
        { id: 'play_100', name: '勤學不倦', desc: '完成 100 題', target: 100, icon: '📚', type: 'play' },
        { id: 'play_500', name: '音樂學者', desc: '完成 500 題', target: 500, icon: '🎓', type: 'play' },
        { id: 'coins_100', name: '小有積蓄', desc: '擁有 100 金幣', target: 100, icon: '💰', type: 'coins' },
        { id: 'coins_500', name: '小富翁', desc: '擁有 500 金幣', target: 500, icon: '🤑', type: 'coins' },
        { id: 'coins_1000', name: '大富翁', desc: '擁有 1000 金幣', target: 1000, icon: '💎', type: 'coins' },
        { id: 'level_5', name: '初露頭角', desc: '達到 5 級', target: 5, icon: '🌟', type: 'level' },
        { id: 'level_10', name: '音樂新星', desc: '達到 10 級', target: 10, icon: '🌠', type: 'level' }
    ];
    
    const achieved = JSON.parse(localStorage.getItem('milestones') || '[]');
    
    milestones.forEach(m => {
        if (achieved.includes(m.id)) return;
        
        let reached = false;
        if (m.type === 'play' && playerData.totalPlayed >= m.target) reached = true;
        if (m.type === 'coins' && playerData.coins >= m.target) reached = true;
        if (m.type === 'level' && playerData.level >= m.target) reached = true;
        
        if (reached) {
            achieved.push(m.id);
            localStorage.setItem('milestones', JSON.stringify(achieved));
            
            // 顯示里程碑動畫
            setTimeout(() => {
                showMilestoneUnlock(m);
            }, 1000);
        }
    });
}

function showMilestoneUnlock(m) {
    const el = document.createElement('div');
    el.style.cssText = 'position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:linear-gradient(135deg,#ffd700,#ff8c00);color:#000;padding:30px 50px;border-radius:20px;font-size:1.5rem;font-weight:bold;z-index:6000;animation:milestonePop 3s forwards;text-align:center;';
    el.innerHTML = `🏆 達成里程碑！<br><span style="font-size:2rem;">${m.icon}</span><br>${m.name}`;
    document.body.appendChild(el);
    
    for (let i = 0; i < 30; i++) setTimeout(() => createConfetti(), i * 50);
    
    setTimeout(() => el.remove(), 3000);

let timerSeconds = 0;
let timerInterval = null;
let timerRunning = false;

function setTimer(minutes) {
    timerSeconds = minutes * 60;
    updateTimerDisplay();
}

function startTimer() {
    if (timerRunning) return;
    timerRunning = true;
    document.getElementById('startBtn').style.display = 'none';
    document.getElementById('pauseBtn').style.display = 'inline-block';
    
    timerInterval = setInterval(() => {
        timerSeconds++;
        updateTimerDisplay();
    }, 1000);
}

function pauseTimer() {
    timerRunning = false;
    clearInterval(timerInterval);
    document.getElementById('startBtn').style.display = 'inline-block';
    document.getElementById('pauseBtn').style.display = 'none';
}

function resetTimer() {
    pauseTimer();
    timerSeconds = 0;
    updateTimerDisplay();
}

function updateTimerDisplay() {
    const mins = Math.floor(timerSeconds / 60);
    const secs = timerSeconds % 60;
    document.getElementById('timerDisplay').textContent = 
        String(mins).padStart(2, '0') + ':' + String(secs).padStart(2, '0');
}
