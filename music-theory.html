<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎵 音樂小學堂 - 從零開始學樂理</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --white-key-width: 35px;
            --black-key-width: 24px;
        }
        @media (max-width: 480px) {
            :root {
                --white-key-width: 28px;
                --black-key-width: 18px;
            }
        }
        body {
            font-family: 'Noto Sans TC', 'Comic Sans MS', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            padding: 20px;
        }
        h1 {
            font-size: 2rem;
            margin-bottom: 10px;
            text-shadow: 0 0 20px #e94560;
            animation: glow 2s ease-in-out infinite alternate;
        }
        @keyframes glow {
            from { text-shadow: 0 0 20px #e94560, 0 0 40px #ff6b6b; }
            to { text-shadow: 0 0 30px #e94560, 0 0 60px #ff6b6b; }
        }
        .level-select {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 20px;
        }
        .level-btn {
            padding: 15px 25px;
            font-size: 1.1rem;
            background: linear-gradient(135deg, #e94560, #0f3460);
            border: none;
            border-radius: 15px;
            color: white;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .level-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(233, 69, 96, 0.5);
        }
        .level-btn.active {
            background: linear-gradient(135deg, #ffd700, #ff8c00);
            color: #000;
        }
        .reset-btn {
            padding: 15px;
            background: rgba(255,255,255,0.1);
            border: 2px solid rgba(255,255,255,0.2);
            border-radius: 15px;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .reset-btn:hover {
            background: rgba(255,0,0,0.3);
            border-color: #ff4444;
            transform: scale(1.05);
        }
        .sound-btn {
            padding: 15px;
            background: rgba(255,255,255,0.1);
            border: 2px solid rgba(255,255,255,0.2);
            border-radius: 15px;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .sound-btn:hover {
            background: rgba(0,255,0,0.2);
            border-color: #44ff44;
            transform: scale(1.05);
        }
        .sound-btn.muted {
            opacity: 0.5;
        }
        #gameArea {
            width: 100%;
            max-width: 600px;
            background: rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            min-height: 400px;
        }
        .note-display {
            font-size: 8rem;
            margin: 20px 0;
            animation: bounce 0.5s ease infinite;
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .options {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-top: 30px;
        }
        .option-btn {
            padding: 20px;
            font-size: 1.5rem;
            background: rgba(255,255,255,0.2);
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 15px;
            color: white;
            cursor: pointer;
            transition: all 0.2s;
        }
        .option-btn:hover {
            background: rgba(255,255,255,0.3);
            transform: scale(1.02);
        }
        .option-btn.correct {
            background: #4caf50 !important;
            border-color: #4caf50 !important;
        }
        .option-btn.wrong {
            background: #f44336 !important;
            border-color: #f44336 !important;
            opacity: 0.5;
        }
        .score-display {
            font-size: 1.5rem;
            margin-bottom: 20px;
            color: #ffd700;
        }
        .progress-bar {
            width: 100%;
            height: 20px;
            background: rgba(255,255,255,0.2);
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 20px;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #e94560, #ffd700);
            transition: width 0.3s;
        }
        .feedback {
            font-size: 2rem;
            margin: 20px 0;
            height: 50px;
        }
        .feedback.correct { color: #4caf50; animation: pop 0.3s; }
        .feedback.wrong { color: #f44336; animation: shake 0.3s; }
        @keyframes pop { 0% { transform: scale(0); } 100% { transform: scale(1); } }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-10px); } 75% { transform: translateX(10px); } }
        
        /* 問題區域淡入動畫 */
        #questionArea {
            animation: fadeIn 0.4s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .staff {
            font-size: 6rem;
            line-height: 1.2;
            margin: 20px 0;
            letter-spacing: 10px;
        }
        .piano {
            display: flex;
            justify-content: center;
            margin: 20px 0;
            position: relative;
            height: 120px;
            max-width: 100%;
            overflow-x: auto;
            --white-key-width: 35px;
            --black-key-width: 24px;
        }
        @media (max-width: 480px) {
            .piano {
                height: 100px;
                --white-key-width: 28px;
                --black-key-width: 18px;
            }
        }
        .key {
            width: var(--white-key-width, 35px);
            height: 120px;
            background: white;
            border: 1px solid #333;
            border-radius: 0 0 5px 5px;
            cursor: pointer;
            transition: background 0.1s;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding-bottom: 8px;
            color: #333;
            font-weight: bold;
            font-size: 0.7rem;
            position: relative;
            z-index: 1;
            flex-shrink: 0;
        }
        @media (max-width: 480px) {
            .key {
                width: var(--white-key-width, 28px);
                height: 100px;
                font-size: 0.6rem;
                padding-bottom: 5px;
            }
            .piano {
                height: 100px;
            }
            .key.black {
                height: 60px;
                width: var(--black-key-width, 18px);
            }
        }
        .key:active, .key.playing {
            background: #ddd;
        }
        .key.black {
            position: absolute;
            width: var(--black-key-width, 24px);
            height: 75px;
            background: #1a1a1a;
            z-index: 2;
            border-radius: 0 0 4px 4px;
            color: white;
            top: 0;
        }
        .key.black:active, .key.black.playing {
            background: #444;
        }
        .key.highlight {
            background: #ffd700 !important;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.7);
        }
        .key.black.highlight {
            background: #ffa500 !important;
            box-shadow: 0 0 15px rgba(255, 165, 0, 0.7);
        }
        .hint {
            font-size: 0.9rem;
            opacity: 0.7;
            margin: 10px 0;
        }
        .streak {
            position: fixed;
            top: 20px;
            right: 20px;
            background: linear-gradient(135deg, #ffd700, #ff8c00);
            color: #000;
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: bold;
            display: none;
        }
        .streak.show { display: block; animation: pulse 0.5s; }
        @keyframes pulse { 0% { transform: scale(0.5); } 100% { transform: scale(1); } }
    </style>
</head>
<body>
    <h1>🎵 音樂小學堂</h1>
    <p class="hint">從零開始，輕鬆學樂理</p>
    
    <div class="level-select">
        <button class="level-btn active" onclick="setLevel(1)">🌱 認識音符 (Q)</button>
        <button class="level-btn" onclick="setLevel(2)">📖 音名與唱名 (W)</button>
        <button class="level-btn" onclick="setLevel(3)">🎼 節奏練習 (E)</button>
        <button class="level-btn" onclick="setLevel(4)">🎹 和弦認識 (R)</button>
        <button class="sound-btn active" id="soundToggle" onclick="toggleSound()" title="切換音效">🔊</button>
        <button class="reset-btn" onclick="resetProgress()" title="重置進度">🗑️</button>
    </div>
    
    <div class="score-display">分數: <span id="score">0</span> | 連續答對: <span id="streakCount">0</span>🔥</div>
    <div class="progress-bar"><div class="progress-fill" id="progress" style="width: 0%"></div></div>
    <p class="hint" style="font-size:0.8rem;margin-bottom:15px;">⌨️ 快捷鍵：1-4 答題 | Q/W/E/R 選關卡 | 空格 播放聲音 | A-J 彈鋼琴</p>
    
    <div id="gameArea">
        <div class="feedback" id="feedback"></div>
        <div id="questionArea"></div>
    </div>
    
    <div class="streak" id="streakPopup">🔥 5連擊！</div>
    
    <script>
        // 音頻上下文 - 延遲初始化，確保在用戶互動後才創建
        let audioCtx = null;
        
        function getAudioContext() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            // 喚醒 AudioContext（解決瀏覽器自動播放政策限制）
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            return audioCtx;
        }
        
        const notes = ['Do', 'Re', 'Mi', 'Fa', 'Sol', 'La', 'Si'];
        const noteNames = { Do: 'C', Re: 'D', Mi: 'E', Fa: 'F', Sol: 'G', La: 'A', Si: 'B' };
        const noteFreqs = { Do: 261.63, Re: 293.66, Mi: 329.63, Fa: 349.23, Sol: 392.00, La: 440.00, Si: 493.88 };
        
        // 從 localStorage 載入儲存的進度
        function loadProgress() {
            const saved = localStorage.getItem('musicTheoryProgress');
            if (saved) {
                try {
                    const data = JSON.parse(saved);
                    return {
                        score: Math.min(Math.max(parseInt(data.score) || 0, 0), 999999),
                        streak: Math.min(Math.max(parseInt(data.streak) || 0, 0), 999),
                        currentLevel: Math.min(Math.max(parseInt(data.currentLevel) || 1, 1), 4),
                        questionsAnswered: Math.max(parseInt(data.questionsAnswered) || 0, 0),
                        correctAnswers: Math.max(parseInt(data.correctAnswers) || 0, 0)
                    };
                } catch (e) {
                    console.error('載入進度失敗:', e);
                }
            }
            return null;
        }

        // 儲存進度到 localStorage
        function saveProgress() {
            try {
                const data = {
                    score: Math.min(score, 999999), // 分數上限保護
                    streak: Math.min(streak, 999),
                    currentLevel: currentLevel,
                    questionsAnswered: questionsAnswered,
                    correctAnswers: correctAnswers,
                    lastPlayed: new Date().toISOString()
                };
                localStorage.setItem('musicTheoryProgress', JSON.stringify(data));
            } catch (e) {
                console.warn('儲存進度失敗:', e);
            }
        }

        // 頁面關閉前自動儲存進度
        window.addEventListener('beforeunload', () => {
            saveProgress();
        });

        // 清除儲存的進度
        function resetProgress() {
            localStorage.removeItem('musicTheoryProgress');
            score = 0;
            streak = 0;
            currentLevel = 1;
            questionsAnswered = 0;
            correctAnswers = 0;
            updateUI();
            setLevel(1);
        }

        // 更新 UI 顯示
        function updateUI() {
            document.getElementById('score').textContent = score;
            document.getElementById('streakCount').textContent = streak;
            updateProgress();
        }

        // 初始化進度
        let savedProgress = loadProgress();
        let score = savedProgress ? savedProgress.score : 0;
        let streak = savedProgress ? savedProgress.streak : 0;
        let currentLevel = savedProgress ? savedProgress.currentLevel : 1;
        let questionsAnswered = savedProgress ? savedProgress.questionsAnswered : 0;
        let correctAnswers = savedProgress ? savedProgress.correctAnswers : 0;
        let currentQuestion = null;
        let currentOptions = []; // 儲存當前題目的選項
        let soundEnabled = true; // 音效開關狀態
        
        // 切換音效開關
        function toggleSound() {
            soundEnabled = !soundEnabled;
            const btn = document.getElementById('soundToggle');
            btn.textContent = soundEnabled ? '🔊' : '🔇';
            btn.classList.toggle('muted', !soundEnabled);
            // 儲存音效設定
            localStorage.setItem('musicTheorySound', soundEnabled ? 'on' : 'off');
        }
        
        // 載入音效設定
        function loadSoundSetting() {
            const saved = localStorage.getItem('musicTheorySound');
            if (saved === 'off') {
                soundEnabled = false;
                const btn = document.getElementById('soundToggle');
                btn.textContent = '🔇';
                btn.classList.add('muted');
            }
        }
        loadSoundSetting();

        // 鍵盤事件監聽
        document.addEventListener('keydown', (e) => {
            // 防止重複觸發（按住不放）
            if (e.repeat) return;
            
            // 數字鍵 1-4 選擇答案（Level 1 可用 1-7）
            const maxOptions = currentLevel === 1 ? 7 : 4;
            if (e.key >= '1' && e.key <= String(maxOptions)) {
                const index = parseInt(e.key) - 1;
                // 確保選項存在且題目未結束
                if (currentOptions[index] && !document.querySelector('.option-btn.correct')) {
                    let option = currentOptions[index];
                    // 取得正確答案
                    let correctAnswer = currentQuestion;
                    if (currentLevel === 3) {
                        // Level 3: 節奏題 - 選項是 beats 值，需轉為數字比對
                        option = parseFloat(option);
                        const rhythm = rhythms.find(r => r.name === currentQuestion);
                        if (rhythm) correctAnswer = rhythm.beats;
                    }
                    checkAnswer(option, correctAnswer);
                }
            }
            // Q/W/E/R 選擇關卡
            if (e.key.toLowerCase() === 'q') setLevel(1);
            if (e.key.toLowerCase() === 'w') setLevel(2);
            if (e.key.toLowerCase() === 'e') setLevel(3);
            if (e.key.toLowerCase() === 'r') setLevel(4);
            // 空白鍵播放聲音
            if (e.key === ' ' && currentQuestion) {
                e.preventDefault();
                if (currentLevel === 4) {
                    // 找到當前和弦並播放
                    const chord = chords.find(c => c.name === currentQuestion);
                    if (chord) playChord(chord.notes.join(','));
                } else {
                    const note = currentLevel === 3 ? 'Do' : currentQuestion;
                    playNote(note);
                }
            }
            // 鋼琴鍵盤快捷鍵 (Level 4)
            if (currentLevel === 4 && currentQuestion) {
                const pianoKey = pianoKeys.find(k => k.key === e.key.toLowerCase());
                if (pianoKey) {
                    e.preventDefault();
                    playPianoKey(pianoKey.note);
                    // 添加視覺反饋
                    const keyElement = document.querySelector(`.key[onclick*="${pianoKey.note}"]`);
                    if (keyElement) {
                        keyElement.classList.add('playing');
                    }
                }
            }
        });
        
        // 鍵盤放開事件 - 移除鋼琴按鍵的視覺效果
        document.addEventListener('keyup', (e) => {
            if (currentLevel === 4 && currentQuestion) {
                const pianoKey = pianoKeys.find(k => k.key === e.key.toLowerCase());
                if (pianoKey) {
                    const keyElement = document.querySelector(`.key[onclick*="${pianoKey.note}"]`);
                    if (keyElement) {
                        keyElement.classList.remove('playing');
                    }
                }
            }
        });
        
        function playNote(note) {
            if (!soundEnabled) return;
            const ctx = getAudioContext();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.frequency.value = noteFreqs[note];
            osc.type = 'sine';
            gain.gain.setValueAtTime(0.3, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.5);
            osc.start();
            osc.stop(ctx.currentTime + 0.5);
        }
        
        function setLevel(level) {
            currentLevel = level;
            document.querySelectorAll('.level-btn').forEach((btn, i) => {
                btn.classList.toggle('active', i + 1 === level);
            });
            questionsAnswered = 0;
            correctAnswers = 0;
            updateProgress();
            saveProgress();
            nextQuestion();
        }
        
        function updateProgress() {
            const progress = questionsAnswered > 0 ? (correctAnswers / questionsAnswered) * 100 : 0;
            document.getElementById('progress').style.width = progress + '%';
        }
        
        function nextQuestion() {
            document.getElementById('feedback').textContent = '';
            document.getElementById('questionArea').innerHTML = '';
            
            switch(currentLevel) {
                case 1: level1Question(); break;
                case 2: level2Question(); break;
                case 3: level3Question(); break;
                case 4: level4Question(); break;
            }
        }
        
        // 🌱 Level 1: 認識音符 - 聽聲音選音符
        function level1Question() {
            const correctNote = notes[Math.floor(Math.random() * notes.length)];
            currentQuestion = correctNote;
            
            // 洗牌選項，確保顯示順序與 currentOptions 一致
            const shuffledNotes = shuffleArray([...notes]);
            currentOptions = shuffledNotes; // 儲存洗牌後的選項順序
            
            const html = `
                <p class="hint">🎧 點擊播放鍵，聽聽是什麼音符？ (按 1-7 選答案)</p>
                <button onclick="playNote('${correctNote}')" style="font-size:3rem;background:linear-gradient(135deg,#e94560,#ff6b6b);border:none;border-radius:50%;width:100px;height:100px;cursor:pointer;">🔊</button>
                <div class="options">
                    ${shuffledNotes.map((n, i) => `<button class="option-btn" onclick="checkAnswer('${n}','${correctNote}')">${i+1}. ${n}</button>`).join('')}
                </div>
            `;
            document.getElementById('questionArea').innerHTML = html;
        }
        
        // 📖 Level 2: 音名與唱名
        function level2Question() {
            const note = notes[Math.floor(Math.random() * notes.length)];
            const mode = Math.random() > 0.5;
            currentQuestion = note;
            
            const question = mode ? `這個音符的音名是？` : `這個音符的唱名是？`;
            const correctAnswer = mode ? noteNames[note] : note;
            
            // 播放聲音
            setTimeout(() => playNote(note), 100);
            
            let options = [correctAnswer];
            const allOptions = mode ? ['C','D','E','F','G','A','B'] : notes;
            
            while (options.length < 4) {
                const opt = allOptions[Math.floor(Math.random() * allOptions.length)];
                if (!options.includes(opt)) options.push(opt);
            }
            options = shuffleArray(options);
            currentOptions = options; // 儲存選項順序
            
            const html = `
                <p class="hint">🎧 ${question} (按 1-4 選答案)</p>
                <div class="note-display">${note}</div>
                <button onclick="playNote('${note}')" style="font-size:2rem;background:rgba(255,255,255,0.2);border:none;border-radius:10px;padding:10px 20px;cursor:pointer;">🔊 再聽一次</button>
                <div class="options">
                    ${options.map((n, i) => `<button class="option-btn" onclick="checkAnswer('${n}','${correctAnswer}')">${i+1}. ${n}</button>`).join('')}
                </div>
            `;
            document.getElementById('questionArea').innerHTML = html;
        }
        
        // 🎼 Level 3: 節奏練習
        const rhythms = [
            { name: '四分音符', beats: 1, symbol: '♩' },
            { name: '二分音符', beats: 2, symbol: '𝅗𝅥' },
            { name: '全音符', beats: 4, symbol: '𝅝' },
            { name: '八分音符', beats: 0.5, symbol: '♪' }
        ];
        
        function level3Question() {
            const rhythm = rhythms[Math.floor(Math.random() * rhythms.length)];
            currentQuestion = rhythm.name;
            
            const options = [0.5, 1, 2, 4];
            currentOptions = options.map(String); // 儲存選項順序 (轉為字串比對)
            
            const html = `
                <p class="hint">這個音符有幾拍？ (按 1-4 選答案)</p>
                <div class="note-display">${rhythm.symbol}</div>
                <p style="font-size:1.5rem;margin:20px 0;">${rhythm.name}</p>
                <div class="options">
                    ${options.map((n, i) => `<button class="option-btn" onclick="checkAnswer(${n},${rhythm.beats})">${i+1}. ${n} 拍</button>`).join('')}
                </div>
            `;
            document.getElementById('questionArea').innerHTML = html;
        }
        
        // 🎹 Level 4: 和弦認識
        const chords = [
            { name: 'C大和弦', notes: ['Do','Mi','Sol'], symbol: 'C' },
            { name: 'G大和弦', notes: ['Sol','Si','Re'], symbol: 'G' },
            { name: 'F大和弦', notes: ['Fa','La','Do'], symbol: 'F' },
            { name: 'Dm和弦', notes: ['Re','Fa','La'], symbol: 'Dm' }
        ];

        // Fisher-Yates 洗牌算法 (公平隨機)
        function shuffleArray(array) {
            const arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        // 根據目前關卡播放答題結果的音效反饋
        function playAnswerFeedback(isCorrect) {
            if (isCorrect) {
                if (currentLevel === 4) {
                    // Level 4: 和弦 - 播放正確答案的和弦
                    const chord = chords.find(c => c.name === currentQuestion);
                    if (chord) {
                        playChord(chord.notes.join(','));
                    }
                } else {
                    // Level 1-3: 播放正確音符
                    let correctNote = currentQuestion;
                    if (currentLevel === 3) {
                        // Level 3: 節奏題 - 找出對應的音符名稱
                        const rhythm = rhythms.find(r => r.name === currentQuestion);
                        if (rhythm) correctNote = notes[0]; // 播放 Do 作為回饋
                    }
                    playNote(correctNote);
                }
            } else {
                // 答錯時播放低沉的失敗音效
                playWrongSound();
            }
        }
        
        // 播放答錯時的音效
        function playWrongSound() {
            if (!soundEnabled) return;
            const ctx = getAudioContext();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.frequency.value = 150; // 較低的頻率
            osc.type = 'sawtooth';
            gain.gain.setValueAtTime(0.2, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
            osc.start();
            osc.stop(ctx.currentTime + 0.3);
        }

        // 鋼琴鍵盤布局：白鍵 + 黑鍵位置
        // 黑鍵位置根據鋼琴八度內的相對位置計算
        // 修正：黑鍵正確位置應在白鍵之間（傳統鋼琴佈局）
        // 鋼琴鍵盤配置：正確的黑鍵位置（Mi♯ 和 Si♯ 不存在）
        const pianoKeys = [
            { note: 'Do', isBlack: false, blackKeyIndex: null, key: 'a' },
            { note: 'Do♯', isBlack: true, blackKeyIndex: 0, key: 'w' },   // 在 Do 和 Re 之間
            { note: 'Re', isBlack: false, blackKeyIndex: null, key: 's' },
            { note: 'Re♯', isBlack: true, blackKeyIndex: 1, key: 'e' },   // 在 Re 和 Mi 之間
            { note: 'Mi', isBlack: false, blackKeyIndex: null, key: 'd' },
            { note: 'Fa', isBlack: false, blackKeyIndex: null, key: 'f' },
            { note: 'Fa♯', isBlack: true, blackKeyIndex: 2, key: 't' },   // 在 Fa 和 Sol 之間
            { note: 'Sol', isBlack: false, blackKeyIndex: null, key: 'g' },
            { note: 'Sol♯', isBlack: true, blackKeyIndex: 3, key: 'y' },   // 在 Sol 和 La 之間
            { note: 'La', isBlack: false, blackKeyIndex: null, key: 'h' },
            { note: 'La♯', isBlack: true, blackKeyIndex: 4, key: 'u' },   // 在 La 和 Si 之間
            { note: 'Si', isBlack: false, blackKeyIndex: null, key: 'j' }
        ];

        function level4Question() {
            const chord = chords[Math.floor(Math.random() * chords.length)];
            currentQuestion = chord.name;
            currentOptions = chords.map(c => c.name); // 儲存選項順序
            
            // 將唱名轉換為對應的鍵盤音符
            const chordKeyMap = {
                'Do': 'Do', 'Re': 'Re', 'Mi': 'Mi', 'Fa': 'Fa', 
                'Sol': 'Sol', 'La': 'La', 'Si': 'Si'
            };
            const activeKeys = chord.notes.map(n => chordKeyMap[n]);
            
            // 從 CSS 變數獲取鍵盤尺寸
            const getKeyWidths = () => {
                // 先使用 fallback 值渲染，確保第一次也能正常顯示
                const isMobile = window.innerWidth <= 480;
                return {
                    white: isMobile ? 28 : 35,
                    black: isMobile ? 18 : 24
                };
            };
            const { white: whiteKeyWidth, black: blackKeyWidth } = getKeyWidths();
            
            const pianoHtml = pianoKeys.map(k => {
                if (k.isBlack) {
                    // 黑鍵位置：使用 blackKeyIndex 計算，正確地位於兩個白鍵之間
                    // blackKeyIndex = 0 表示在第1個白鍵(Do)之後，即 Do 和 Re 之間
                    const leftPos = (k.blackKeyIndex + 1) * whiteKeyWidth - (blackKeyWidth / 2);
                    return `<div class="key black" style="left:${leftPos}px" onclick="playPianoKey('${k.note}')" title="${k.note} (${k.key.toUpperCase()})"></div>`;
                } else {
                    const isHighlight = activeKeys.includes(k.note);
                    return `<div class="key ${isHighlight?'highlight':''}" onclick="playPianoKey('${k.note}')">${k.note}<span style="font-size:0.6rem;display:block;">${k.key.toUpperCase()}</span></div>`;
                }
            }).join('');
            
            const html = `
                <p class="hint">🎧 聽和弦，選擇正確的名稱 (按 1-4 選答案 | A-J 彈鋼琴)（黃色鍵為和弦組成音）</p>
                <button onclick="playChord('${chord.notes.join(',')}')" style="font-size:3rem;background:linear-gradient(135deg,#9b59b6,#8e44ad);border:none;border-radius:50%;width:100px;height:100px;cursor:pointer;">🔊</button>
                <div class="piano">
                    ${pianoHtml}
                </div>
                <div class="options">
                    ${chords.map((c, i) => `<button class="option-btn" onclick="checkAnswer('${c.name}','${chord.name}')">${i+1}. ${c.name}</button>`).join('')}
                </div>
            `;
            document.getElementById('questionArea').innerHTML = html;
        }

        function playPianoKey(note) {
            // 映射鋼琴音符到頻率
            const noteFreqMap = {
                'Do': 261.63, 'Do♯': 277.18,
                'Re': 293.66, 'Re♯': 311.13,
                'Mi': 329.63,
                'Fa': 349.23, 'Fa♯': 369.99,
                'Sol': 392.00, 'Sol♯': 415.30,
                'La': 440.00, 'La♯': 466.16,
                'Si': 493.88
            };
            playPianoNote(noteFreqMap[note] || 261.63);
        }

        function playPianoNote(freq) {
            const ctx = getAudioContext();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.frequency.value = freq;
            osc.type = 'sine';
            gain.gain.setValueAtTime(0.3, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.5);
            osc.start();
            osc.stop(ctx.currentTime + 0.5);
        }
        
        // 真正同時播放和弦（而非依次彈奏）
        function playChord(notesStr) {
            if (!soundEnabled) return;
            const notes = notesStr.split(',');
            const ctx = getAudioContext();
            
            // 同時創建多個振盪器，每個音符一個
            notes.forEach((noteName, i) => {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.frequency.value = noteFreqs[noteName];
                osc.type = 'sine'; // 和弦使用正弦波更和諧
                
                // 稍微錯開開始時間避免相位問題，創造更豐滿的音色
                gain.gain.setValueAtTime(0, ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.2, ctx.currentTime + 0.02);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.8);
                
                osc.start(ctx.currentTime);
                osc.stop(ctx.currentTime + 0.8);
            });
        }
        
        function checkAnswer(answer, correct) {
            const isCorrect = String(answer) === String(correct);
            questionsAnswered++;
            
            const feedback = document.getElementById('feedback');
            feedback.className = 'feedback ' + (isCorrect ? 'correct' : 'wrong');
            feedback.textContent = isCorrect ? '✅ 答對了！' : '❌ 錯了～';
            
            // 標記答案按鈕（答對顯示綠色，答錯顯示紅色+綠色標記正確答案）
            const buttons = document.querySelectorAll('.option-btn');
            buttons.forEach(btn => {
                const btnText = btn.textContent.replace(/^\d+\.\s*/, '').trim(); // 移除前面的數字編號
                if (isCorrect) {
                    if (btnText === String(correct)) {
                        btn.classList.add('correct');
                    }
                } else {
                    // 答錯時標記錯誤答案和正確答案
                    if (btnText === String(answer)) {
                        btn.classList.add('wrong');
                    }
                    if (btnText === String(correct)) {
                        btn.classList.add('correct');
                    }
                }
                btn.disabled = true; // 禁用所有按鈕防止重複答題
            });
            
            if (isCorrect) {
                score += 10 + streak * 2;
                streak++;
                correctAnswers++;
                
                // 顯示連擊
                if (streak >= 3) {
                    const popup = document.getElementById('streakPopup');
                    popup.textContent = `🔥 ${streak}連擊！`;
                    popup.classList.add('show');
                    setTimeout(() => popup.classList.remove('show'), 1000);
                }
            } else {
                streak = 0;
            }
            
            document.getElementById('score').textContent = score;
            document.getElementById('streakCount').textContent = streak;
            updateProgress();
            
            // 儲存進度到 localStorage
            saveProgress();
            
            // 答錯顯示正確答案
            if (!isCorrect) {
                setTimeout(() => {
                    feedback.textContent += ` 正確答案是：${correct}`;
                }, 500);
            }

            // 播放答題結果的音效反饋
            setTimeout(() => playAnswerFeedback(isCorrect), 300);
            
            setTimeout(nextQuestion, 1500);
        }
        
        // 初始化 - 恢復儲存的進度
        document.getElementById('score').textContent = score;
        document.getElementById('streakCount').textContent = streak;
        updateProgress();
        setLevel(currentLevel);
    </script>
</body>
</html>
